display_name: GLM 5.3 Flash SFT LoRA Fine-Tuning (verl 0.9) (29k)
instance_types:
- ml.p5.48xlarge
run:
  model_type: verl
  name: verl-sft-glm-5-dot-3-flash-lora
  results_dir: ${base_results_dir}/${.name}
trainer:
  devices: 8
  num_nodes: 2
training_config:
  checkpoint:
    _target_: verl.trainer.config.CheckpointConfig
    async_save: false
    load_contents:
    - model
    - optimizer
    - extra
    - hf_model
    save_contents:
    - model
    - optimizer
    - extra
    - hf_model
    strict: true
  data:
    apply_chat_template_kwargs: {}
    assistant_eos_token: <|endoftext|>
    balance_dp_token: false
    custom_cls:
      name: null
      path: null
    enable_thinking_default: null
    enable_thinking_key: enable_thinking
    ignore_input_ids_mismatch: false
    max_length: 30000
    max_token_len_per_gpu: 30000
    messages_key: messages
    micro_batch_size_per_gpu: 1
    num_workers: 8
    pad_mode: no_padding
    tools_key: tools
    train_batch_size: 32
    train_files: null
    train_max_samples: -1
    train_val_split_ratio: 1.0
    truncation: right
    use_dynamic_bsz: true
    use_shm: false
    val_files: null
    val_max_samples: -1
  engine:
    _target_: verl.workers.config.McoreEngineConfig
    context_parallel_size: 1
    dist_checkpointing_path: null
    dist_checkpointing_prefix: ''
    dist_ckpt_optim_fully_reshardable: false
    distrib_optim_fully_reshardable_mem_efficient: false
    dtype: bfloat16
    dynamic_context_parallel: false
    entropy_from_logits_chunk_size: 2048
    entropy_from_logits_with_chunking: false
    expert_model_parallel_size: 16
    expert_tensor_parallel_size: 1
    forward_only: false
    grad_offload: false
    max_seqlen_per_dp_cp_rank: null
    optimizer_offload: false
    override_ddp_config: {}
    override_mcore_model_config: {}
    override_transformer_config:
      attention_backend: flash
      dsa_kernel_backend: cudnn
      moe_grouped_gemm: true
      moe_router_dtype: fp32
      moe_shared_expert_overlap: false
      moe_token_dispatcher_type: alltoall
      recompute_granularity: full
      recompute_method: uniform
      recompute_modules:
      - core_attn
      recompute_num_layers: 1
    pad_bshd_to_minibatch_max: true
    pad_to_length: false
    pad_to_length_bucket: 512
    param_offload: false
    pipeline_model_parallel_size: 1
    qat:
      _target_: verl.workers.config.QATEngineConfig
      activation_observer: null
      enable: false
      group_size: 16
      ignore_patterns:
      - lm_head
      - '*mlp.gate'
      mode: w4a16
      quantization_config_path: null
    router_replay:
      _target_: verl.workers.config.EngineRouterReplayConfig
      mode: disabled
      record_file: null
      replay_file: null
    seed: 42
    sequence_parallel: true
    strategy: megatron
    tensor_model_parallel_size: 8
    use_dist_checkpointing: false
    use_distributed_optimizer: true
    use_mbridge: true
    use_megatron_fsdp: false
    use_remove_padding: true
    vanilla_mbridge: false
    virtual_pipeline_model_parallel_size: null
  mlflow:
    run_id: ''
    tracking_uri: ''
  model:
    _target_: verl.workers.config.HFModelConfig
    custom_chat_template: null
    enable_activation_offload: false
    enable_gradient_checkpointing: true
    exclude_modules: null
    external_lib: null
    fused_kernel_options:
      impl_backend: torch
    hf_config_path: null
    lora:
      a2a_experimental: false
      adapter_path: null
      alpha: 32
      dropout: 0.0
      dropout_position: pre
      dtype: null
      exclude_modules: []
      freeze_language_model: true
      freeze_vision_model: true
      freeze_vision_projection: true
      lora_A_init_method: xavier
      lora_B_init_method: zero
      merge: false
      rank: 128
      target_modules:
      - linear_q_down_proj
      - linear_q_up_proj
      - linear_kv_down_proj
      - linear_proj
      - linear_fc1
      - linear_fc2
      type: lora
    lora_adapter_path: null
    lora_alpha: 32
    lora_rank: 128
    mtp:
      _target_: verl.workers.config.MtpConfig
      detach_encoder: false
      enable: false
      enable_rollout: false
      enable_train: false
      method: mtp
      mtp_loss_scaling_factor: 0.1
      num_speculative_tokens: 1
      speculative_algorithm: EAGLE
      speculative_eagle_topk: 1
      speculative_num_draft_tokens: 4
      speculative_num_steps: 3
    override_config: {}
    path: zai-org/GLM-5.3-Flash
    target_modules:
    - linear_q_down_proj
    - linear_q_up_proj
    - linear_kv_down_proj
    - linear_proj
    - linear_fc1
    - linear_fc2
    tiled_mlp:
      enabled: false
      num_shards: 4
    tokenizer_path: null
    trust_remote_code: false
    use_fused_kernels: false
    use_liger: false
    use_remove_padding: true
    use_shm: false
  optim:
    _target_: verl.workers.config.McoreOptimizerConfig
    betas:
    - 0.9
    - 0.999
    clip_grad: 1.0
    exp_avg_dtype: fp32
    exp_avg_sq_dtype: fp32
    lr: 0.0001
    lr_decay_steps: null
    lr_decay_style: cosine
    lr_warmup_init: 0.0
    lr_warmup_steps: -1
    lr_warmup_steps_ratio: 0.1
    lr_wsd_decay_steps: null
    lr_wsd_decay_style: exponential
    main_grads_dtype: fp32
    min_lr: 1.0e-05
    muon_coefficient_type: quintic
    muon_extra_scale_factor: 1.0
    muon_fp32_matmul_prec: medium
    muon_match_adamw_update_rms: false
    muon_momentum: 0.95
    muon_nesterov: false
    muon_num_ns_steps: 5
    muon_scalar_optimizer: adam
    muon_scale_mode: spectral
    muon_split_qkv: true
    muon_tp_mode: blockwise
    optimizer: adam
    override_optimizer_config: {}
    total_training_steps: -1
    use_checkpoint_opt_param_scheduler: false
    use_layer_wise_distributed_optimizer: false
    use_precision_aware_optimizer: false
    weight_decay: 0.0
    weight_decay_incr_style: constant
  profiler:
    _target_: verl.utils.profiler.ProfilerConfig
    all_ranks: false
    enable: false
    ranks: []
    save_path: outputs/profile
    tool: torch
    tool_config:
      npu:
        _target_: verl.utils.profiler.config.NPUToolConfig
        analysis: true
        contents: []
        discrete: false
        level: level0
        name: npu
        profile_token_end: null
        profile_token_start: null
      nsys:
        _target_: verl.utils.profiler.config.NsightToolConfig
        discrete: ${oc.select:recipes.training_config.global_profiler.global_tool_config.nsys.discrete}
        name: nsight
      precision_debugger:
        _target_: verl.utils.profiler.config.PrecisionDebuggerToolConfig
        config_path: ${oc.select:recipes.training_config.global_profiler.global_tool_config.precision_debugger.config_path,null}
        name: precision_debugger
        stages: ${oc.select:recipes.training_config.global_profiler.global_tool_config.precision_debugger.stages,null}
        steps: null
      torch:
        _target_: verl.utils.profiler.config.TorchProfilerToolConfig
        contents: []
        discrete: false
        name: torch
        profile_token_end: null
        profile_token_start: null
        schedule:
          _target_: verl.utils.profiler.config.TorchProfilerScheduleConfig
          active: 0
          repeat: 0
          skip_first: 0
          wait: 0
          warmup: 0
      torch_memory:
        _target_: verl.utils.profiler.config.TorchMemoryToolConfig
        name: torch_memory
        stack_depth: ${oc.select:recipes.training_config.global_profiler.global_tool_config.torch_memory.stack_depth,32}
        trace_alloc_max_entries: ${oc.select:recipes.training_config.global_profiler.global_tool_config.torch_memory.trace_alloc_max_entries,100000}
  trainer:
    balance_batch: true
    default_hdfs_dir: null
    default_local_dir: /opt/ml/model
    device: cuda
    experiment_name: glm_5_3_flash_sft_megatron_lora
    logger:
    - console
    - mlflow
    - tensorboard
    max_ckpt_to_keep: 3
    merge_lora_on_final_save: true
    n_gpus_per_node: 8
    nnodes: 2
    profile_interval:
    - -1
    - -1
    project_name: verl_sft_glm_5_3_flash
    resume_from_path: null
    resume_mode: disable
    save_freq: after_each_epoch
    seed: 42
    test_freq: after_each_epoch
    total_epochs: 3
    total_training_steps: null
  trainer_callbacks:
  - _target_: metering_callback.MeteringCallback
    output_path: /opt/ml/metering
version: 1.0.0
