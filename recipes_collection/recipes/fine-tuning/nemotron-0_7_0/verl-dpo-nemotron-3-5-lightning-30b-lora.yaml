display_name: Nemotron 3.5 Lightning 30B DPO LoRA Fine-Tuning with Megatron
instance_types:
- ml.p5.48xlarge
- ml.p4de.24xlarge
run:
  model_type: verl
  name: verl-dpo-nemotron-3-5-lightning-30b-lora
  results_dir: ${base_results_dir}/${.name}
trainer:
  devices: 8
  num_nodes: 1
training_config:
  checkpoint:
    _target_: verl.trainer.config.CheckpointConfig
    load_contents:
    - model
    - optimizer
    - extra
    - hf_model
    save_contents:
    - model
    - optimizer
    - extra
    - hf_model
    save_only_adapter_if_lora: true
  data:
    _target_: verl.utils.dataset.dpo_dataset.DPODataConfig
    apply_chat_template_kwargs: {}
    chosen_key: chosen
    custom_cls:
      name: null
      path: null
    dataloader_num_workers: 8
    max_length: 4096
    max_token_len_per_gpu: 8192
    micro_batch_size_per_gpu: 1
    pad_mode: no_padding
    prompt_key: prompt
    rejected_key: rejected
    remove_invalid_samples: false
    seed: 42
    shuffle: true
    split_seed: 42
    train_batch_size: 128
    train_files: null
    train_max_samples: -1
    train_val_split_ratio: 0.9
    truncation: left
    use_dynamic_bsz: true
    use_shm: false
    val_files: null
    val_max_samples: -1
  engine:
    _target_: verl.workers.config.McoreEngineConfig
    context_parallel_size: 1
    dist_checkpointing_path: null
    dist_checkpointing_prefix: ''
    dist_ckpt_optim_fully_reshardable: true
    distrib_optim_fully_reshardable_mem_efficient: false
    dtype: bfloat16
    expert_model_parallel_size: 8
    expert_tensor_parallel_size: 1
    forward_only: false
    grad_offload: false
    optimizer_offload: false
    override_ddp_config: {}
    override_mcore_model_config: {}
    override_transformer_config:
      apply_rope_fusion: false
      attention_backend: auto
      gradient_accumulation_fusion: false
      keep_mtp_spec_in_bf16: true
      moe_router_dtype: fp32
      mtp_hybrid_override_pattern: '*E'
      mtp_loss_scaling_factor: 0.3
      mtp_num_layers: 2
      mtp_use_repeated_layer: true
      recompute_granularity: selective
      recompute_method: null
      recompute_modules:
      - moe
      - layernorm
      - core_attn
      - mlp
      recompute_num_layers: null
      use_fused_weighted_squared_relu: true
    param_offload: false
    pipeline_model_parallel_size: 1
    seed: 42
    sequence_parallel: true
    strategy: megatron
    tensor_model_parallel_size: 8
    use_dist_checkpointing: false
    use_distributed_optimizer: true
    use_mbridge: true
    use_remove_padding: true
    vanilla_mbridge: false
    virtual_pipeline_model_parallel_size: null
  mlflow:
    run_id: ''
    tracking_uri: ''
  model:
    _target_: verl.workers.config.HFModelConfig
    custom_chat_template: null
    enable_activation_offload: false
    enable_gradient_checkpointing: true
    exclude_modules: null
    external_lib: verl.models.mcore.nemotron_h_patch
    fused_kernel_options:
      impl_backend: torch
    hf_config_path: null
    is_saving_checkpoint_in_lora: false
    lora:
      a2a_experimental: false
      adapter_path: null
      alpha: 128
      dropout: 0.0
      dropout_position: pre
      dtype: null
      exclude_modules: []
      freeze_language_model: true
      freeze_vision_model: true
      freeze_vision_projection: true
      lora_A_init_method: xavier
      lora_B_init_method: zero
      rank: 64
      target_modules:
      - linear_qkv
      - linear_proj
      - linear_fc1
      - linear_fc2
      - in_proj
      - out_proj
      type: lora
    lora_adapter_path: null
    lora_alpha: 16
    lora_rank: 64
    mtp:
      _target_: verl.workers.config.MtpConfig
      detach_encoder: false
      enable: true
      enable_rollout: false
      enable_train: true
      mtp_loss_scaling_factor: 0.3
    override_config: {}
    path: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
    target_modules: all-linear
    tiled_mlp:
      enabled: false
      num_shards: 4
    tokenizer_path: null
    trust_remote_code: true
    use_fused_kernels: false
    use_liger: false
    use_remove_padding: false
    use_shm: false
  optim:
    _target_: verl.workers.config.McoreOptimizerConfig
    betas:
    - 0.9
    - 0.999
    clip_grad: 1.0
    lr: 0.0001
    lr_decay_steps: null
    lr_decay_style: cosine
    lr_warmup_init: 0.0
    lr_warmup_steps: -1
    lr_warmup_steps_ratio: 0.1
    lr_wsd_decay_steps: null
    lr_wsd_decay_style: exponential
    min_lr: 1.0e-05
    optimizer: adam
    override_optimizer_config:
      use_precision_aware_optimizer: true
    total_training_steps: -1
    use_checkpoint_opt_param_scheduler: false
    weight_decay: 0.0
    weight_decay_incr_style: constant
  profiler:
    _target_: verl.utils.profiler.ProfilerConfig
    all_ranks: false
    enable: false
    ranks: []
    save_path: outputs/profile
    tool: torch
    tool_config:
      npu:
        _target_: verl.utils.profiler.config.NPUToolConfig
        analysis: true
        contents: []
        discrete: false
        level: level0
        name: npu
      nsys:
        _target_: verl.utils.profiler.config.NsightToolConfig
        discrete: ${oc.select:recipes.training_config.global_profiler.global_tool_config.nsys.discrete}
        name: nsight
      torch:
        _target_: verl.utils.profiler.config.TorchProfilerToolConfig
        manual_save: true
        name: torch
        step_end: null
        step_start: 0
      torch_memory:
        _target_: verl.utils.profiler.config.TorchMemoryToolConfig
        name: torch_memory
        stack_depth: ${oc.select:recipes.training_config.global_profiler.global_tool_config.torch_memory.stack_depth,32}
        trace_alloc_max_entries: ${oc.select:recipes.training_config.global_profiler.global_tool_config.torch_memory.trace_alloc_max_entries,100000}
  trainer:
    beta: 0.01
    default_hdfs_dir: null
    default_local_dir: /opt/ml/model
    device: cuda
    experiment_name: dpo-lora
    label_smoothing: 0.0
    logger:
    - console
    - mlflow
    loss_type: sigmoid
    max_ckpt_to_keep: 3
    merge_lora_on_final_save: true
    n_gpus_per_node: 8
    nnodes: 1
    profile_interval:
    - -1
    - -1
    project_name: Nemotron-Lightning
    reference_free: false
    resume_from_path: null
    resume_mode: auto
    save_freq: after_each_epoch
    test_freq: 5
    total_epochs: 3
    total_training_steps: null
    training_mode: auto
  trainer_callbacks:
  - _target_: metering_callback.MeteringCallback
    output_path: /opt/ml/metering
version: 2.0.1
