# JumpStart Recipe Exclusion Patterns
#
# Regex patterns for recipes that should NOT be published to JumpStart.
# Matched against recipe IDs (e.g. "fine-tuning/llama/llmft_llama3_1_8b_...").
# Uses re.search(), so patterns match anywhere unless anchored with ^ / $.
#
# This file replaces the MODEL_ALLOWLIST in the JumpStart Lambda
# (SageMakerJumpStartHyperPodRecipeScripts/constants.py).
# The patterns are passed to the Lambda's exclusionPatterns argument
# (see CR-260699046).

exclusion_patterns:
  # Nova evaluation recipes on the JumpStart RECIPE_DENYLIST
  - "multi_modal_benchmark_eval$"
  - "llm_judge_eval$"
  - "rubric_llm_judge_eval$"
  - "full_fine_tuning$"
  - "gpu_fine_tuning$"
  - "llama[_-]?4[_-]?scout"
  # Checkpointless recipes are not published to Jumpstart
  - "checkpointless"
  # Block Verl SFT recipes for Qwen models other than 3-dot-5 and 3-dot-6
  - "verl-sft-qwen-3-(?!dot-[56])"
  - "verl-sft-qwen-2-5"
  - "fine-tuning/qwen-0_7_0/verl-sft-qwen-3-14b-fft"
  # Block gpt_oss-0_7_0 and qwen-0_7_0/qwen-3-32b recipes (use verl 0.5.0 versions instead)
  - "gpt_oss-0_7_0/"
  - "qwen-0_7_0/.*qwen-3-32b"
  - "verl-sft-gpt-oss-20b-lora"
  # FFT recipes we do not want to publish — FFT x {SFT, DPO, RLAIF, RLVR} for
  # Llama-3-2-1b / Llama-3-1-8b / Llama-3-2-3b (pending inference endpoint fix).
  - "fine-tuning/llama/llmft_llama3_2_1b_instruct_seq4k_gpu_dpo_fft"
  - "fine-tuning/llama/llmft_llama3_2_1b_instruct_seq4k_gpu_sft_fft"
  - "fine-tuning/llama/verl-grpo-rlaif-llama-3-dot-2-1b-instruct-fft"
  - "fine-tuning/llama/verl-grpo-rlvr-llama-3-dot-2-1b-instruct-fft"
  - "fine-tuning/llama/llmft_llama3_1_8b_instruct_seq4k_gpu_dpo_fft"
  - "fine-tuning/llama/llmft_llama3_1_8b_instruct_seq4k_gpu_sft_fft"
  - "fine-tuning/llama/verl-grpo-rlaif-llama-3-dot-1-8b-instruct-fft"
  - "fine-tuning/llama/verl-grpo-rlvr-llama-3-dot-1-8b-instruct-fft"
  - "fine-tuning/llama/llmft_llama3_2_3b_instruct_seq4k_gpu_dpo_fft"
  - "fine-tuning/llama/llmft_llama3_2_3b_instruct_seq4k_gpu_sft_fft"
  - "fine-tuning/llama/verl-grpo-rlaif-llama-3-dot-2-3b-instruct-fft"
  - "fine-tuning/llama/verl-grpo-rlvr-llama-3-dot-2-3b-instruct-fft"
  # Qwen 3.5 35B-A3B, Qwen 3.5 122B-A10B and Qwen 3.6 35B-A3B MoE recipes are not
  # published to JumpStart yet — hosting configs pending.
  - "qwen-0_7_0/verl-(grpo-(rlaif|rlvr)|sft)-qwen-3-dot-(5-(35b-a3b|122b-a10b)|6-35b-a3b)"
  # Per-instance verl SFT/DPO recipes for Llama and GPT-OSS: the measured
  # sequence lengths ship as recipes but are not published to JumpStart yet.
  # One entry per (model, instance, length), so a single pattern covers all 49.
  - "fine-tuning/(llama|gpt_oss)-0_7_0/verl-(sft|dpo)-.*-\\d+k-tt-(fft|lora)"
