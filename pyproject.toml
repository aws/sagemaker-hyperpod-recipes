[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amzn-sagemaker-hyperpod-recipes-staging"
version = "1.0"
description = "AWS HyperPod Launcher for distributed training"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Amazon Web Services"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"
dependencies = [
    "hydra-core==1.3.2",
    "omegaconf>=2.2,<2.3",
    "pynvml==11.4.1",
    "requests==2.26.0",
    "tqdm==4.62.3",
    "zstandard==0.15.2",
    "tensorboard==2.12.0",
    # boto3 surface (sts client, session region lookup). Floor rather than exact
    # pin so downstream consumers can resolve a newer botocore.
    "boto3>=1.35.66",
    "PyYAML>=6.0",
    "pydantic>=2.0.0",
    "sagemaker>=2.0.0",
    "pytest-xdist",
    "pytest-cov",
    "pytest-subtests",
    "pathspec",
]

[project.optional-dependencies]
dev = [
    "ruamel.yaml>=0.17",
]

# Unlike an optional-dependency extra, a group in tool.uv.default-groups is
# installed by a bare `uv run`.
[dependency-groups]
scripts = [
    "poethepoet>=0.24",
    "ruamel.yaml>=0.17",
]

[project.urls]
Homepage = "https://github.com/aws/sagemaker-hyperpod-recipes"
Repository = "https://github.com/aws/sagemaker-hyperpod-recipes"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["launcher", "utils"]
# Editable installs only: makes the repo root importable so scripts/ and tests/
# can import scripts, hyperpod_recipes, etc. Does not affect the built wheel.
dev-mode-dirs = ["."]

[tool.hatch.build.targets.wheel.force-include]
"launcher/nemo/nemo_framework_launcher/launcher_scripts/nemo_launcher" = "nemo_launcher"

[tool.pytest.ini_options]
minversion = 7.0
# durations=0 will display all tests execution time, sorted in ascending order starting from from the slowest one.
# -vv will also display tests with durration = 0.00s
addopts = [
    "--cache-clear",
    "--quiet",
    # Uncomment this line to see durations
    # "--durations=0",
    "-n=auto",
    "--cov=launcher/",
    "--cov=hyperpod_recipes/",
    "--cov=scripts/validations/validation_launchers/k8s_launcher.py",
    # uncomment this line to see a detailed HTML test coverage report instead of the usual summary table output to stdout.
    "--cov-report=xml",
    # "--cov-report=html"
]
testpaths = ["tests"]
norecursedirs = [".eggs", ".pytest_cache", "*.egg-info", ".git", "build"]

# ---- Peru/Hatch build infrastructure (for publishing wheel to WIRE) ----

[tool.hatch.build]
directory = "./build"

[tool.hatch.envs.default]
python = "3.12"
lock-filename = "requirements/requirements-default.txt"

[tool.hatch.envs.default.scripts]
# release is a no-op: tests run via existing CI, peru-hatch handles build+publish
release = ["echo 'Skipping tests - handled by existing CI'"]
update = ["hatch-pip-compile --upgrade --all"]

[tool.hatch.envs.build-tools]
python = "3.12"
detached = true
skip-install = true
dependencies = [
  "hatch",
  "hatch-pip-compile",
]

[tool.hatch.env]
requires = ["hatch-pip-compile"]

[tool.hatch.env.collectors.custom]
path = ".hatch/hatch_plugin.py"
disable_lockfile_update_on_build_fleet = true

[tool.isort]
profile = "black"
known_first_party = ["hyperpod_recipes", "launcher", "scripts", "utils"]

[tool.uv]
default-groups = ["scripts"]

# Dev-only tasks, run as `uv run poe <task> [args]`. Poe runs these from the
# project root with the root on sys.path. Not bundled into the wheel.
[tool.poe.tasks]
detect-recipes = { script = "scripts.detect_recipes:main" }
check-jumpstart-recipes = { script = "scripts.check_jumpstart_recipes:main" }
generate-containers-doc = { script = "scripts.generate_containers_doc:main" }
generate-hyperparameters-doc = { script = "scripts.generate_hyperparameters_doc:main" }
generate-launch-jsons = { script = "scripts.generate_launch_jsons:main" }
generate-recipes-doc = { script = "scripts.generate_recipes_doc:main" }
generate-resolved-recipes = { script = "scripts.generate_resolved_recipes:main" }
generate-launcher-scripts = { script = "scripts.launcher_scripts_generator.generate_launcher_scripts:main" }
hydra-prune = { script = "scripts.hydra_prune:main" }
hydra-resolver = { script = "scripts.hydra_resolver:main" }
record-metrics = { script = "scripts.record_metrics:main" }
export-hub-content = { script = "scripts.model_hub.export_hub_content:main" }
import-hub-content = { script = "scripts.model_hub.import_hub_content:main" }
update-private-hub = { script = "scripts.model_hub.update_private_hub:main" }
pysdk-serverless = { script = "scripts.validations.pysdk_serverless:main" }
validate-recipes = { script = "scripts.validations.validation_script_runner:main" }
