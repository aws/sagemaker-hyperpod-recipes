defaults:
  - /hydra_config/verl-0_7_0/default_megatron
  - _self_

display_name: Nemotron 3 Nano 30B GRPO RLVR Fine-Tuning with Megatron FFT
version: 2.0.5
instance_types:
  - ml.p5.48xlarge
  - ml.p4de.24xlarge

run:
  model_type: verl
  name: verl-grpo-nemotron-3-nano-30b-fft
  results_dir: ${base_results_dir}/${.name}

trainer:
  num_nodes: 1

ray_cluster:
  worker_nodes:
    replicas: 1

training_config:
  # Algorithm: switch from GAE (upstream default) to GRPO
  algorithm:
    adv_estimator: grpo
    kl_ctrl:
      kl_coef: 0.0

  actor_rollout_ref:
    actor:
      rollout_n: 8
      kl_loss_coef: 0.0
      ppo_mini_batch_size: 64
      ppo_micro_batch_size_per_gpu: 2
      clip_ratio_c: 10.0
      clip_ratio_high: 0.28
      megatron:
        tensor_model_parallel_size: 8
        expert_model_parallel_size: 8
        expert_tensor_parallel_size: 1
        vanilla_mbridge: false
        grad_offload: true
        optimizer_offload: true
        param_offload: true
        override_transformer_config:
          apply_rope_fusion: true
          moe_router_dtype: fp32
          recompute_granularity: full
          recompute_method: uniform
          recompute_num_layers: 1
      optim:
        weight_decay: 0.1
        override_optimizer_config:
          optimizer_cpu_offload: true
          optimizer_offload_fraction: 1
          overlap_cpu_optimizer_d2h_h2d: true
          use_precision_aware_optimizer: true

    # Reference model overrides
    ref:
      rollout_n: 8
      log_prob_micro_batch_size_per_gpu: 4
      log_prob_max_token_len_per_gpu: 16384
      log_prob_use_dynamic_bsz: true
      use_torch_compile: true
      megatron:
        tensor_model_parallel_size: 8
        expert_model_parallel_size: 8
        expert_tensor_parallel_size: 1
        use_remove_padding: true
        use_mbridge: true
        vanilla_mbridge: false
        param_offload: true
        override_transformer_config:
          apply_rope_fusion: true
          attention_backend: flash
          moe_router_dtype: fp32
          recompute_granularity: full
          recompute_method: uniform
          recompute_modules:
            - core_attn
          recompute_num_layers: 1

    # Rollout overrides (vLLM engine)
    rollout:
      name: vllm
      prompt_length: 3072
      response_length: 5120
      tensor_model_parallel_size: 8
      gpu_memory_utilization: 0.25
      calculate_log_probs: true
      log_prob_micro_batch_size_per_gpu: 4
      log_prob_max_token_len_per_gpu: 16384
      log_prob_use_dynamic_bsz: true
      load_format: dummy
      val_kwargs:
        temperature: 1.0
        do_sample: true
        top_p: 0.7

    # Model config (Nemotron 3 Nano 30B + FFT)
    model:
      path: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
      trust_remote_code: true
      is_saving_checkpoint_in_lora: false
  critic:
    ppo_mini_batch_size: 64
    model:
      tokenizer_path: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16

  # Trainer overrides
  trainer:
    project_name: Nemotron-Nano
    experiment_name: code
    logger:
      - console
      - mlflow
    test_freq: 10
    save_freq: 10
    total_epochs: 2
    default_local_dir: /opt/ml/model
    merge_lora_on_final_save: true
  data:
    max_prompt_length: 3072
    max_response_length: 5120
    return_raw_chat: true
    truncation: left
    train_val_split_ratio: 0.9

  # Reward model overrides
  reward_model:
    reward_manager: prime
    rollout:
      name: vllm
    model:
      input_tokenizer: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16

  # Reward manager (RLVR)
  reward_manager:
    name: prime
  custom_reward_function:
    lambda_arn: ''
    path: ''
    name: ''

  mlflow:
    run_id: ''
    tracking_uri: ''
