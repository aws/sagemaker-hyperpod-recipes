defaults:
  - /hydra_config/verl-0_7_0/dpo_megatron_trainer
  - /hydra_config/verl-0_7_0/dpo/default
  - /hydra_config/verl-0_7_0/model_config/nemotron-3-nano-4b
  - _self_

display_name: "Nemotron 3 Nano 4B DPO LoRA Fine-Tuning with Megatron"
version: 2.0.1
instance_types:
  - ml.p5.48xlarge
  - ml.p4de.24xlarge

run:
  name: verl-dpo-nemotron-3-nano-4b-lora

trainer:
  num_nodes: 1

training_config:
  data:
    train_batch_size: 32
    micro_batch_size_per_gpu: 1
    max_length: 32768
    # chosen + rejected are packed together: keep max_token_len_per_gpu >= 2 * max_length.
    max_token_len_per_gpu: 65536
    truncation: left
    train_max_samples: -1
    train_val_split_ratio: 0.9

  model:
    enable_gradient_checkpointing: true
    use_remove_padding: true
    is_saving_checkpoint_in_lora: false
    lora_rank: 32
    lora_alpha: 64
    lora:
      type: lora
      rank: 32
      alpha: 64
      dropout: 0.0
      dropout_position: pre
      dtype: null
      exclude_modules: []
      lora_A_init_method: xavier
      lora_B_init_method: zero
      a2a_experimental: false
      adapter_path: null
      freeze_language_model: true
      freeze_vision_model: true
      freeze_vision_projection: true
      # No in_proj: at TP>1 its LoRA delta is exported and merged in per-rank row order (Megatron-Bridge #6310).
      target_modules:
        - linear_qkv
        - linear_proj
        - linear_fc1
        - linear_fc2
        - out_proj

  engine:
    tensor_model_parallel_size: 8
    pipeline_model_parallel_size: 1
    expert_model_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: true
    use_remove_padding: true
    use_mbridge: true
    vanilla_mbridge: false
    param_offload: false
    grad_offload: false
    optimizer_offload: false
    dist_ckpt_optim_fully_reshardable: true
    distrib_optim_fully_reshardable_mem_efficient: false
    override_transformer_config:
      apply_rope_fusion: false
      attention_backend: auto
      gradient_accumulation_fusion: false
      # Not full/uniform: on this image it leaves the LoRA gradients at zero (Megatron-Bridge #5586).
      recompute_granularity: selective
      recompute_method: null
      recompute_modules:
        - layernorm
        - core_attn
        - mlp
      recompute_num_layers: null

  optim:
    lr: 5.0e-5
    min_lr: 5.0e-6
    betas: [0.9, 0.999]
    weight_decay: 0.0
    clip_grad: 1.0
    lr_decay_style: cosine
    lr_warmup_steps: -1
    lr_warmup_steps_ratio: 0.1
    override_optimizer_config:
      use_precision_aware_optimizer: true

  checkpoint:
    save_contents:
      - model
      - optimizer
      - extra
      - hf_model
    load_contents:
      - model
      - optimizer
      - extra
      - hf_model
    save_only_adapter_if_lora: true

  trainer:
    nnodes: 1
    project_name: Nemotron-Nano-4B
    experiment_name: dpo-lora
    beta: 0.05
    loss_type: sigmoid
    label_smoothing: 0.0
    reference_free: false
    logger:
      - console
      - mlflow
      - tensorboard
    # 2, not 3: a third epoch overfit on this model (val acc ~0.77 -> ~0.69).
    total_epochs: 2
    save_freq: after_each_epoch
    test_freq: 5
    max_ckpt_to_keep: 3
    resume_mode: auto
    default_local_dir: /opt/ml/model
    merge_lora_on_final_save: true
  # Expandable segments: 32k/side variable-length pairs otherwise fragment the allocator.
  # This list replaces the base list, so MeteringCallback is restated.
  trainer_callbacks:
    - _target_: metering_callback.MeteringCallback
      output_path: /opt/ml/metering
    - _target_: verl.utils.device.set_expandable_segments
      enable: true
