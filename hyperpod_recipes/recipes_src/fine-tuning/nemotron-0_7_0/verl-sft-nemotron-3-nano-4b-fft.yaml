defaults:
  - /hydra_config/verl-0_7_0/sft/default
  - /hydra_config/verl-0_7_0/sft/data/default
  - /hydra_config/verl-0_7_0/model/hf_model
  - /hydra_config/verl-0_7_0/engine/megatron
  - /hydra_config/verl-0_7_0/optim/megatron
  - /hydra_config/verl-0_7_0/sft/trainer/default
  - /hydra_config/verl-0_7_0/profiler/profiler
  - /hydra_config/verl-0_7_0/sft/checkpoint/default
  - /hydra_config/verl-0_7_0/model_config/nemotron-3-nano-4b
  - _self_

display_name: "Nemotron 3 Nano 4B SFT FFT Fine-Tuning"
version: 2.0.1
instance_types:
  - ml.p5.48xlarge
  - ml.p4de.24xlarge

run:
  name: verl-sft-nemotron-3-nano-4b-fft

trainer:
  num_nodes: 1

training_config:
  data:
    train_batch_size: 32
    micro_batch_size_per_gpu: 1
    max_length: 65536
    max_token_len_per_gpu: 65536
    truncation: left
    train_max_samples: -1
    val_max_samples: -1
    ignore_input_ids_mismatch: true
    train_num_workers: 0
    val_num_workers: 0

  engine:
    tensor_model_parallel_size: 8
    pipeline_model_parallel_size: 1
    expert_model_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: true
    use_mbridge: true
    vanilla_mbridge: false
    param_offload: false
    grad_offload: false
    optimizer_offload: false
    override_transformer_config:
      recompute_granularity: full
      recompute_method: uniform
      recompute_num_layers: 1
      attention_backend: auto
      calculate_per_token_loss: true
      gradient_accumulation_fusion: false

  optim:
    lr: 5.0e-6
    min_lr: 0.0
    lr_warmup_steps: -1
    lr_warmup_steps_ratio: 0.1
    weight_decay: 0.033
    betas: [0.9, 0.95]
    lr_decay_style: cosine
    override_optimizer_config:
      use_precision_aware_optimizer: true
      adam_beta2: 0.95

  trainer:
    nnodes: 1
    project_name: verl_sft_nemotron_3_nano_4b
    experiment_name: nemotron_3_nano_4b_sft_megatron_fft
    total_epochs: 1
    merge_lora_on_final_save: true
  # Expandable segments: 64k variable-length rows otherwise fragment the allocator.
  # This list replaces the base list, so MeteringCallback is restated.
  trainer_callbacks:
    - _target_: metering_callback.MeteringCallback
      output_path: /opt/ml/metering
    - _target_: verl.utils.device.set_expandable_segments
      enable: true
