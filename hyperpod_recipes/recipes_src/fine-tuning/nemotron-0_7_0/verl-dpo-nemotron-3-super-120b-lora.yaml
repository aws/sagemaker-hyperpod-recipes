defaults:
  - /hydra_config/verl-0_7_0/dpo_megatron_trainer
  - /hydra_config/verl-0_7_0/dpo/default
  - /hydra_config/verl-0_7_0/sft/model_config/nemo3-super-120b
  - _self_

display_name: "Nemo3 Super 120B DPO LoRA Fine-Tuning with Megatron"
version: 2.0.4
instance_types:
  - ml.p5.48xlarge

run:
  name: verl-dpo-nemo3-super-120b-lora

trainer:
  num_nodes: 4

training_config:
  data:
    train_batch_size: 32
    micro_batch_size_per_gpu: 1
    max_length: 7000
    # DPO packs chosen+rejected into a single sequence, so max_token_len_per_gpu
    # must stay >= 2 * max_length (seqlen_balancing.py asserts).
    max_token_len_per_gpu: 14000
    truncation: left
    train_max_samples: -1
    train_val_split_ratio: 0.9

  model:
    enable_gradient_checkpointing: true
    use_remove_padding: true
    is_saving_checkpoint_in_lora: false
    lora_rank: 0
    lora_alpha: 16
    lora:
      type: lora
      rank: 128
      alpha: 256
      dropout: 0.0
      dropout_position: pre
      dtype: null
      exclude_modules: []
      lora_A_init_method: xavier
      lora_B_init_method: zero
      a2a_experimental: false
      adapter_path: null
      freeze_language_model: true
      freeze_vision_model: true
      freeze_vision_projection: true
      target_modules:
        - linear_qkv
        - linear_proj
        - in_proj
        - out_proj

  engine:
    tensor_model_parallel_size: 8
    expert_model_parallel_size: 8
    expert_tensor_parallel_size: 1
    pipeline_model_parallel_size: 4
    context_parallel_size: 1
    sequence_parallel: true
    use_remove_padding: true
    use_mbridge: true
    vanilla_mbridge: false
    param_offload: false
    grad_offload: false
    optimizer_offload: false
    dist_ckpt_optim_fully_reshardable: true
    distrib_optim_fully_reshardable_mem_efficient: false
    override_transformer_config:
      apply_rope_fusion: true
      attention_backend: flash
      moe_router_dtype: fp32
      moe_latent_size: 1024
      moe_shared_expert_overlap: false
      mtp_num_layers: 0
      recompute_granularity: full
      recompute_method: uniform
      recompute_modules:
        - core_attn
      recompute_num_layers: 1

  optim:
    lr: 1.0e-4
    min_lr: 1.0e-6
    betas: [0.9, 0.95]
    weight_decay: 0.1
    clip_grad: 1.0
    lr_decay_style: cosine
    lr_warmup_steps: 10
    lr_warmup_steps_ratio: 0.0
    override_optimizer_config:
      use_precision_aware_optimizer: true

  checkpoint:
    save_contents:
      - model
      - optimizer
      - extra
      - hf_model
    load_contents:
      - model
      - optimizer
      - extra
      - hf_model
    save_only_adapter_if_lora: true

  trainer:
    project_name: verl_dpo_nemo3_super
    experiment_name: nemo3_super_120b_dpo_megatron_lora
    beta: 0.01
    loss_type: sigmoid
    label_smoothing: 0.0
    reference_free: false
    logger:
      - console
      - mlflow
      - tensorboard
    total_epochs: 5
    save_freq: after_each_epoch
    test_freq: 5
    max_ckpt_to_keep: 3
    resume_mode: auto
    default_local_dir: /opt/ml/model
    merge_lora_on_final_save: true
