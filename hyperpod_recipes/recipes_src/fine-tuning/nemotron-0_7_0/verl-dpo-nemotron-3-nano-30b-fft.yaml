defaults:
  - /hydra_config/verl-0_7_0/dpo_megatron_trainer
  - /hydra_config/verl-0_7_0/dpo/default
  - /hydra_config/verl-0_7_0/model_config/nemo3-nano-30b
  - _self_

display_name: "Nemotron 3 Nano 30B DPO FFT Fine-Tuning with Megatron"
version: 2.0.4
instance_types:
  - ml.p5.48xlarge

run:
  name: verl-dpo-nemotron-3-nano-30b-fft

trainer:
  num_nodes: 2

training_config:
  data:
    train_batch_size: 16
    micro_batch_size_per_gpu: 1
    max_length: 8192
    # DPO packs chosen+rejected into a single sequence, so max_token_len_per_gpu
    # must stay >= 2 * max_length (seqlen_balancing.py asserts).
    max_token_len_per_gpu: 16384
    truncation: left
    train_max_samples: -1
    train_val_split_ratio: 0.9

  model:
    enable_gradient_checkpointing: true
    use_remove_padding: true
    lora_rank: 0

  engine:
    tensor_model_parallel_size: 8
    expert_model_parallel_size: 8
    expert_tensor_parallel_size: 1
    pipeline_model_parallel_size: 2
    context_parallel_size: 1
    sequence_parallel: true
    use_remove_padding: true
    use_mbridge: true
    vanilla_mbridge: false
    param_offload: false
    grad_offload: false
    optimizer_offload: false
    dist_ckpt_optim_fully_reshardable: true
    distrib_optim_fully_reshardable_mem_efficient: false
    override_transformer_config:
      attention_backend: flash
      recompute_granularity: full
      recompute_method: uniform
      recompute_modules:
        - core_attn
      recompute_num_layers: 1

  optim:
    lr: 5.0e-5
    min_lr: 1.0e-6
    betas: [0.9, 0.95]
    weight_decay: 0.1
    clip_grad: 1.0
    lr_decay_style: cosine
    lr_warmup_steps: 10
    lr_warmup_steps_ratio: 0.0
    override_optimizer_config:
      use_precision_aware_optimizer: true

  checkpoint:
    save_contents:
      - model
      - optimizer
      - extra
      - hf_model
    load_contents:
      - model
      - optimizer
      - extra
      - hf_model
    save_only_adapter_if_lora: true

  trainer:
    project_name: verl_dpo_nemo3_nano
    experiment_name: nemo3_nano_30b_dpo_megatron_fft
    beta: 0.01
    loss_type: sigmoid
    label_smoothing: 0.0
    reference_free: false
    logger:
      - console
      - mlflow
      - tensorboard
    total_epochs: 5
    save_freq: after_each_epoch
    test_freq: 5
    max_ckpt_to_keep: 3
    resume_mode: auto
    default_local_dir: /opt/ml/model
    merge_lora_on_final_save: false
