defaults:
  - /hydra_config/verl-0_7_0/default_megatron
  - _self_

display_name: Nemotron 3 Super 120B GRPO RLAIF Fine-Tuning with Megatron LoRA
version: 1.1.4
instance_types:
  - ml.p5.48xlarge

run:
  model_type: verl
  name: verl-grpo-nemotron-3-super-120b-lora
  results_dir: ${base_results_dir}/${.name}

trainer:
  num_nodes: 4

ray_cluster:
  worker_nodes:
    replicas: 3

training_config:
  # Algorithm: GRPO
  algorithm:
    adv_estimator: grpo
    kl_ctrl:
      kl_coef: 0.0

  actor_rollout_ref:
    actor:
      rollout_n: 16
      kl_loss_coef: 0.0
      ppo_mini_batch_size: 64
      ppo_micro_batch_size_per_gpu: 1
      clip_ratio_high: 0.28
      megatron:
        tensor_model_parallel_size: 8
        expert_model_parallel_size: 16
        expert_tensor_parallel_size: 1
        vanilla_mbridge: false
        grad_offload: true
        optimizer_offload: true
        param_offload: true
        override_transformer_config:
          apply_rope_fusion: true
          moe_router_dtype: fp32
          moe_latent_size: 1024
          moe_shared_expert_overlap: false
          recompute_granularity: full
          recompute_method: uniform
          recompute_num_layers: 1
      optim:
        weight_decay: 0.0
        override_optimizer_config:
          optimizer_cpu_offload: true
          optimizer_offload_fraction: 1
          overlap_cpu_optimizer_d2h_h2d: true
          use_precision_aware_optimizer: true

    # Reference model overrides
    ref:
      rollout_n: 16
      log_prob_micro_batch_size_per_gpu: 2
      log_prob_max_token_len_per_gpu: 16384
      log_prob_use_dynamic_bsz: true
      use_torch_compile: true
      megatron:
        tensor_model_parallel_size: 8
        expert_model_parallel_size: 16
        expert_tensor_parallel_size: 1
        use_remove_padding: true
        use_mbridge: true
        vanilla_mbridge: false
        param_offload: true
        override_transformer_config:
          moe_latent_size: 1024
          moe_shared_expert_overlap: false

    # Rollout overrides (vLLM engine)
    rollout:
      name: vllm
      prompt_length: 1024
      response_length: 5120
      tensor_model_parallel_size: 8
      gpu_memory_utilization: 0.45
      max_model_len: 8192
      calculate_log_probs: true
      log_prob_micro_batch_size_per_gpu: 2
      log_prob_max_token_len_per_gpu: 16384
      log_prob_use_dynamic_bsz: true
      load_format: dummy
      max_num_batched_tokens: 6144
      'n': 16
      val_kwargs:
        temperature: 1.0
        do_sample: true
        top_p: 0.7
    model:
      path: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16
      trust_remote_code: true
      external_lib:
        verl.models.mcore.nemotron_h_patch,verl.models.vllm.nemotron_h_latent_moe_patch
      is_saving_checkpoint_in_lora: false
      lora:
        rank: 128
        alpha: 256
        target_modules:
          - linear_qkv
          - linear_proj
          - in_proj
          - out_proj

  # Critic overrides
  critic:
    ppo_mini_batch_size: 64
    model:
      tokenizer_path: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16
      external_lib:
        verl.models.mcore.nemotron_h_patch,verl.models.vllm.nemotron_h_latent_moe_patch

  # Trainer overrides
  trainer:
    project_name: Nemotron-Super
    experiment_name: rlaif-lora
    logger:
      - console
      - mlflow
    test_freq: 10
    save_freq: 10
    total_epochs: 1
    default_local_dir: /opt/ml/model
    merge_lora_on_final_save: true
    nnodes: 4

  # Data overrides
  data:
    max_prompt_length: 1024
    max_response_length: 5120
    return_raw_chat: true
    truncation: left
    train_val_split_ratio: 0.9

  # Reward model overrides
  reward_model:
    reward_manager: batch
    rollout:
      name: vllm
    model:
      input_tokenizer: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16
      external_lib:
        verl.models.mcore.nemotron_h_patch,verl.models.vllm.nemotron_h_latent_moe_patch
    megatron:
      override_transformer_config:
        moe_latent_size: 1024
        moe_shared_expert_overlap: false
    reward_kwargs:
      reward_fn_name: llmj
      kwargs:
        llmj_prompt_template_path: /opt/ml/code/verl/summarize.jinja
        model_id: bedrock/deepseek.v3-v1:0
        service_tier: flex
        max_workers: 100
        num_retries: 5
        range:
          - 0.0
          - 1.0
        aws_region_name: us-west-2
        sampling_params:
          temperature: 0.0
          max_completion_tokens: 2048

  # Reward manager (RLAIF - batch)
  reward_manager:
    name: batch
  custom_reward_function:
    lambda_arn: ''
    path: ''
    name: ''

  mlflow:
    run_id: ''
    tracking_uri: ''
