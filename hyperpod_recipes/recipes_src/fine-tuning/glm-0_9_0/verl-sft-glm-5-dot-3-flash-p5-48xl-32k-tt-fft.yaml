defaults:
  - /hydra_config/verl-0_9_0/recipe/verl-sft-glm-5-dot-3-flash-fft
  - _self_

display_name: "GLM 5.3 Flash SFT Full Fine-Tuning (verl 0.9) (32k)"
# This 8-node layout offloads the whole optimizer state to host memory. It is sized for 80 GB GPUs
# and was run on ml.p5.48xlarge. ml.p5en is listed because it ran the 64k recipe. On ml.p5e or
# ml.p5en, use verl-sft-glm-5-dot-3-flash-p5en-48xl-64k-tt-fft instead: it needs only 4 nodes and
# also trains on rows shorter than 64k tokens.
instance_types: ["ml.p5.48xlarge", "ml.p5en.48xlarge"]

training_config:
  data:
    max_length: 32768
    # Packed tokens per GPU per micro-batch.
    max_token_len_per_gpu: 32768
