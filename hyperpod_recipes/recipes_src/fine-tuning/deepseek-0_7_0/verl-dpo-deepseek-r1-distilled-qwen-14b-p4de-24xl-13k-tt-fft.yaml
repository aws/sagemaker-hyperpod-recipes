defaults:
  - /hydra_config/verl-0_7_0/recipe/verl-dpo-deepseek-r1-distilled-qwen-14b-fft
  - _self_

display_name: "DeepSeek R1 Distill Qwen 14B DPO Full Fine-Tuning (13k)"
instance_types: ["ml.p4de.24xlarge", "ml.p5.48xlarge"]

training_config:
  data:
    # Length from token sweep 2d9956f49630 (2026-09-15), chain ml.p4de.24xlarge:
    # last_safe_token 13312, 53.7 GB peak (67% of an 80 GB A100). A sweep ceiling on its
    # own is weak evidence (1 epoch, train_batch_size = num_gpus x 1), but this rung does
    # not rest on it alone: ml.p5.48xlarge completed 16384 for this slot under matrix
    # conditions (2 epochs, validation, train_batch_size = 32), and p4de carries the same
    # 80 GB of HBM, so 13312 sits below an already-proven length on equal hardware.
    # DPO packs a chosen and a rejected sequence, hence budget = 2x length.
    max_length: 13312
    max_token_len_per_gpu: 26624
