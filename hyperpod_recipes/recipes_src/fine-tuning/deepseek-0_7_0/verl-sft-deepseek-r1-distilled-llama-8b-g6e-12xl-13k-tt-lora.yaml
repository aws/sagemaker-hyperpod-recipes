defaults:
  - /hydra_config/verl-0_7_0/recipe/verl-sft-deepseek-r1-distilled-llama-8b-lora
  - _self_

display_name: "DeepSeek R1 Distill Llama 8B SFT LoRA Fine-Tuning (13k)"
instance_types: ["ml.g6e.12xlarge"]
# 4 GPUs per node, not the 8 the base recipe assumes:
# every instance listed above is a 4-GPU type.
trainer:
  devices: 4

training_config:
  trainer:
    n_gpus_per_node: 4
  data:
    max_length: 13312
    max_token_len_per_gpu: 13312
