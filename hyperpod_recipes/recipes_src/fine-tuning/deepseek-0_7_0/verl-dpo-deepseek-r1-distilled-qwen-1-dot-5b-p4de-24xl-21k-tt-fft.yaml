defaults:
  - /hydra_config/verl-0_7_0/recipe/verl-dpo-deepseek-r1-distilled-qwen-1-dot-5b-fft
  - _self_

display_name: "DeepSeek R1 Distill Qwen 1.5B DPO Full Fine-Tuning (21k)"
instance_types: ["ml.p4de.24xlarge", "ml.p5.48xlarge"]

training_config:
  data:
    # Length from token sweep 5d2294908ba1 (2026-09-15), chain ml.p4de.24xlarge:
    # last_safe_token 21504, 53.9 GB peak (67% of an 80 GB A100). A sweep ceiling on its
    # own is weak evidence (1 epoch, train_batch_size = num_gpus x 1), but this rung does
    # not rest on it alone: ml.p5.48xlarge completed 25000 for this slot under matrix
    # conditions (2 epochs, validation, train_batch_size = 32), and p4de carries the same
    # 80 GB of HBM, so 21504 sits below an already-proven length on equal hardware.
    # DPO packs a chosen and a rejected sequence, hence budget = 2x length.
    max_length: 21504
    max_token_len_per_gpu: 43008
