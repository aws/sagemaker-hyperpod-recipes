defaults:
  - /hydra_config/verl-0_7_0/recipe/verl-sft-deepseek-r1-distilled-qwen-1-dot-5b-fft
  - _self_

display_name: "DeepSeek R1 Distill Qwen 1.5B SFT Full Fine-Tuning (11k)"
instance_types: ["ml.g6.12xlarge"]
# 4 GPUs per node, not the 8 the base recipe assumes:
# every instance listed above is a 4-GPU type.
trainer:
  devices: 4

training_config:
  trainer:
    n_gpus_per_node: 4
  data:
    # SWEEP-DERIVED, NOT MATRIX-CONFIRMED. Token sweep 22ba3bf206f9 (2026-09-15), chain
    # ml.g6.12xlarge: last_safe_token 11264, 16.2 GB peak (68% of a 24 GB L4). 12288 also
    # completed but at utilisation 0.729, over the 0.7 safety threshold; 14336 OOMed.
    # This is the first 4-GPU rung in any deepseek FFT slot — no 24 GB instance has ever
    # been matrix-tested here, so the probe (1 epoch, train_batch_size = 4) is the only
    # evidence, against a matrix that runs 2 epochs with validation at
    # train_batch_size = 32. Confirm with a matrix job before relying on it.
    max_length: 11264
    max_token_len_per_gpu: 11264
