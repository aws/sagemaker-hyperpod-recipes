defaults:
  - /hydra_config/verl-0_7_0/recipe/verl-sft-llama-3-dot-3-70b-instruct-fft
  - _self_

display_name: "Llama 3.3 70B Instruct SFT Full Fine-Tuning (8k)"
instance_types: ["ml.p5.48xlarge"]

training_config:
  data:
    # Longest length a completed k8s run measured for this slot.
    max_length: 8192
    max_token_len_per_gpu: 8192
    # Must be >= trainer.nnodes * n_gpus_per_node, or verl floors the per-rank batch to 0.
    train_batch_size: 32

  trainer:
    # Must equal trainer.num_nodes: this is the world size declared to verl in verl_config.yaml.
    nnodes: 4
