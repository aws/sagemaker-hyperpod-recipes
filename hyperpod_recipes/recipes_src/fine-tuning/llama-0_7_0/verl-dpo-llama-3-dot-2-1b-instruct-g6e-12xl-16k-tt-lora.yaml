defaults:
  - /hydra_config/verl-0_7_0/recipe/verl-dpo-llama-3-dot-2-1b-instruct-lora
  - _self_

display_name: "Llama 3.2 1B Instruct DPO LoRA Fine-Tuning (16k)"
instance_types: ["ml.g6e.12xlarge"]
# 4 GPUs per node, not the 8 the base recipe assumes:
# every instance listed above is a 4-GPU type.
trainer:
  devices: 4

training_config:
  trainer:
    n_gpus_per_node: 4
  data:
    max_length: 16384
    max_token_len_per_gpu: 32768
