defaults:
  - /hydra_config/verl-0_7_0/sft/default
  - /hydra_config/verl-0_7_0/sft/data/default
  - /hydra_config/verl-0_7_0/model/hf_model
  - /hydra_config/verl-0_7_0/engine/fsdp
  - /hydra_config/verl-0_7_0/optim/fsdp
  - /hydra_config/verl-0_7_0/sft/trainer/default
  - /hydra_config/verl-0_7_0/profiler/profiler
  - /hydra_config/verl-0_7_0/sft/checkpoint/default
  - /hydra_config/verl-0_7_0/sft/peft/lora
  - /hydra_config/verl-0_7_0/model_config/muse-glimmer-30b
  - _self_

display_name: "Muse-Glimmer 30B SFT LoRA Fine-Tuning (Text)"
version: 2.0.1
instance_types: ["ml.p5.48xlarge", "ml.p4de.24xlarge"]

run:
  name: verl-sft-muse-glimmer-30b-lora

trainer:
  num_nodes: 1

training_config:
  data:
    ignore_input_ids_mismatch: true
    train_batch_size: 128
    micro_batch_size_per_gpu: 1
    max_length: 32768
    max_token_len_per_gpu: 32768
    # Use left truncation. With right truncation, inputs whose answer sits at the end lose the
    # response entirely and every remaining token is masked out of the loss.
    truncation: left
    apply_chat_template_kwargs:
      enable_thinking: false

  engine:
    strategy: fsdp2

  optim:
    lr: 5.0e-05
    lr_warmup_steps: 10

  trainer:
    project_name: muse-glimmer-sft
    experiment_name: muse-glimmer-30b-sft-lora
    test_freq: 5
