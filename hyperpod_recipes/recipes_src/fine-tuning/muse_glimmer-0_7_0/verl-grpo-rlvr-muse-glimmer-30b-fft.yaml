defaults:
  - /hydra_config/verl-0_7_0/default
  - _self_

display_name: Muse-Glimmer 30B GRPO RLVR Full Fine-Tuning (Text)
version: 2.0.6
instance_types:
  - ml.p5.48xlarge
run:
  model_type: verl
  name: verl-grpo-rlvr-muse-glimmer-30b-fft
  results_dir: ${base_results_dir}/${.name}
trainer:
  num_nodes: 1

ray_cluster:
  head_node:
    cpu: '16'
    cpuLimit: null
    gpu: '0'
    memory: 32Gi
    memoryLimit: null
  worker_nodes:
    cpu: '48'
    cpuLimit: null
    gpu: '8'
    memory: 144Gi
    memoryLimit: null
    replicas: 1

training_config:
  algorithm:
    adv_estimator: grpo
    norm_adv_by_std_in_grpo: true

  actor_rollout_ref:
    actor:
      use_kl_loss: true
      clip_ratio_high: 0.28
      ppo_mini_batch_size: 32
      ppo_micro_batch_size_per_gpu: 2
      ppo_max_token_len_per_gpu: 16384
      calculate_entropy: true
      entropy_from_logits_with_chunking: true
      fsdp_config:
        optimizer_offload: true
        strategy: fsdp2
      optim:
        lr: 1.0e-06
        warmup_style: constant

    ref:
      log_prob_micro_batch_size_per_gpu: 1
      log_prob_use_dynamic_bsz: true
      log_prob_max_token_len_per_gpu: 16384
      fsdp_config:
        param_offload: true
        strategy: fsdp2

    rollout:
      name: vllm
      # Keep these equal to data.max_prompt_length / data.max_response_length below; the literal
      # values here override the platform's interpolation, so they do not follow edits to it.
      prompt_length: 4096
      response_length: 12288
      tensor_model_parallel_size: 8
      gpu_memory_utilization: 0.5
      # Must be at least prompt_length + response_length; more only reserves cache that cannot fill.
      max_model_len: 16384
      max_num_batched_tokens: 16384
      log_prob_micro_batch_size_per_gpu: 1
      log_prob_use_dynamic_bsz: true
      log_prob_max_token_len_per_gpu: 16384
      disable_log_stats: false
      merge_lora_for_inference: false
      'n': 8

    model:
      path: meta-models/Muse-Glimmer-30B
      external_lib: verl.models.vllm.muse_glimmer
      trust_remote_code: true
      override_config:
        attn_implementation: flash_attention_2
      use_fused_kernels: true
      fused_kernel_options:
        # torch is the only supported backend for this model; the triton path raises.
        impl_backend: torch

  # Unused by GRPO; matches the actor budget so generated docs report the real sequence length.
  critic:
    ppo_max_token_len_per_gpu: 16384

  trainer:
    project_name: muse-glimmer-rl
    experiment_name: muse-glimmer-30b-grpo-rlvr-fft
    logger:
      - console
      - mlflow
    nnodes: 1
    test_freq: 5
    total_epochs: 1
    # Must be an integer here; the "after_each_epoch" sentinel is not supported on the RL path.
    save_freq: 5
    default_local_dir: /opt/ml/model
    merge_lora_on_final_save: true

  data:
    max_prompt_length: 4096
    max_response_length: 12288
    train_batch_size: 128
    truncation: left
    trust_remote_code: true
    apply_chat_template_kwargs:
      reasoning_strength: high
    train_val_split_ratio: 0.9
    split_seed: 42

  reward_model:
    rollout:
      name: vllm

  reward_manager:
    name: prime
  custom_reward_function:
    lambda_arn: ''
    path: ''
    name: ''

  mlflow:
    run_id: ''
    tracking_uri: ''
