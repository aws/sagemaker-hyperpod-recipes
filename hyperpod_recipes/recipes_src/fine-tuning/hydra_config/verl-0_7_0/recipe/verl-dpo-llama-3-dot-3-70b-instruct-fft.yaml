# @package recipes
defaults:
  - /hydra_config/verl-0_7_0/sft/default
  - /hydra_config/verl-0_7_0/dpo/data/default
  - /hydra_config/verl-0_7_0/model/hf_model
  - /hydra_config/verl-0_7_0/engine/fsdp
  - /hydra_config/verl-0_7_0/optim/fsdp
  - /hydra_config/verl-0_7_0/sft/trainer/default
  - /hydra_config/verl-0_7_0/dpo/trainer/default
  - /hydra_config/verl-0_7_0/profiler/profiler
  - /hydra_config/verl-0_7_0/sft/checkpoint/default
  - _self_

version: 1.0.1

run:
  name: verl-dpo-llama-3-dot-3-70b-instruct-fft

trainer:
  # 70B full fine-tuning does not fit one node, and DPO holds two sequences per record
  # (prompt+chosen and prompt+rejected), so the per-GPU budget is 2x the length.
  num_nodes: 4

training_config:
  data:
    train_batch_size: 64
    micro_batch_size_per_gpu: 1
    truncation: left

  model:
    path: meta-llama/Llama-3.3-70B-Instruct

  engine:
    use_torch_compile: true
    model_dtype: bfloat16
    strategy: fsdp2

  optim:
    lr: 1.0e-5
    weight_decay: 0.0
    lr_warmup_steps_ratio: 0.1
    min_lr_ratio: 0.1
    lr_scheduler_type: cosine

  trainer:
    beta: 0.01
    loss_type: sigmoid
