# @package recipes
defaults:
  - /hydra_config/verl-0_7_0/sft/default
  - /hydra_config/verl-0_7_0/sft/data/default
  - /hydra_config/verl-0_7_0/model/hf_model
  - /hydra_config/verl-0_7_0/engine/fsdp
  - /hydra_config/verl-0_7_0/optim/fsdp
  - /hydra_config/verl-0_7_0/sft/trainer/default
  - /hydra_config/verl-0_7_0/profiler/profiler
  - /hydra_config/verl-0_7_0/sft/checkpoint/default
  - _self_

version: 1.0.4

run:
  name: verl-sft-llama-3-dot-1-8b-instruct-fft

trainer:
  num_nodes: 1

training_config:
  data:
    train_batch_size: 64
    micro_batch_size_per_gpu: 8
    truncation: left
    ignore_input_ids_mismatch: true
    use_dynamic_bsz: true
    train_val_split_ratio: 0.9
    train_dataset_name: ""  # llmft parity override: training_data_name
    val_dataset_name: ""  # llmft parity override: validation_data_name
    seed: 42  # llmft parity override: seed

  engine:
    strategy: fsdp2
    model_dtype: bf16
    forward_prefetch: true

  model:
    path: meta-llama/Llama-3.1-8B-Instruct
    trust_remote_code: false
    use_liger: true
    use_fused_kernels: false
    generation_cfg:  # llmft parity override: temperature, max_response_length
      temperature: 0.6
      max_new_tokens: 2048

  optim:
    lr: 1.0e-05
    lr_warmup_steps_ratio: 0.1
    weight_decay: 0.0
    betas: [0.9, 0.95]
    lr_scheduler_type: cosine
    gradient_clipping: true  # llmft parity override: gradient_clipping

  trainer:
    project_name: verl_sft_llama_3_1_8b
    experiment_name: llama_3_1_8b_sft_fsdp_fft_tatqa
    total_epochs: 1
    max_ckpt_to_keep: 3
    resume_mode: resume_path
    logging_steps: 1  # llmft parity override: logging_steps
