# @package recipes
defaults:
  - /hydra_config/verl-0_7_0/sft/default
  - /hydra_config/verl-0_7_0/sft/data/default
  - /hydra_config/verl-0_7_0/model/hf_model
  - /hydra_config/verl-0_7_0/engine/fsdp
  - /hydra_config/verl-0_7_0/optim/fsdp
  - /hydra_config/verl-0_7_0/sft/trainer/default
  - /hydra_config/verl-0_7_0/profiler/profiler
  - /hydra_config/verl-0_7_0/sft/checkpoint/default
  - _self_

version: 1.0.1

run:
  name: verl-sft-deepseek-r1-distilled-llama-70b-fft

trainer:
  # 70B full fine-tuning does not fit one node: bf16 weights alone are ~140GB, and
  # optimizer state plus activations exceed a single node's 640GB. Matches every other
  # 70B+ FFT recipe, and is the shape the token sweep measured this slot at.
  num_nodes: 4

training_config:
  data:
    # Global batch size. Must be >= total GPUs (nodes * 8) to avoid batch_size=0 error.
    # Per-GPU DataLoader batch = train_batch_size // world_size. With 4 nodes: 64 // 32 = 2.
    train_batch_size: 64
    # Unused when use_dynamic_bsz=true (default). Dynamic batching uses max_token_len_per_gpu instead.
    micro_batch_size_per_gpu: null
    truncation: left
    ignore_input_ids_mismatch: true
    use_dynamic_bsz: true

  model:
    path: deepseek-ai/DeepSeek-R1-Distill-Llama-70B
    trust_remote_code: false
    use_liger: true
    use_fused_kernels: false

  engine:
    strategy: fsdp2
    model_dtype: bf16
    forward_prefetch: true

  optim:
    lr: 1.0e-05
    weight_decay: 0.1
    betas: [0.9, 0.95]
    lr_scheduler_type: cosine

  trainer:
    project_name: verl_sft_deepseek_r1_distill_llama_70b
    experiment_name: deepseek_r1_distill_llama_70b_sft_fsdp_fft_tatqa
    total_epochs: 1
    max_ckpt_to_keep: 3
    resume_mode: resume_path
