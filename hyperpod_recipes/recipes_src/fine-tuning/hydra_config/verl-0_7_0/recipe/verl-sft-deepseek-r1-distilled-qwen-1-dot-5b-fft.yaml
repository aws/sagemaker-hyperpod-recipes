# @package recipes
defaults:
  - /hydra_config/verl-0_7_0/sft/default
  - /hydra_config/verl-0_7_0/sft/data/default
  - /hydra_config/verl-0_7_0/model/hf_model
  - /hydra_config/verl-0_7_0/engine/fsdp
  - /hydra_config/verl-0_7_0/optim/fsdp
  - /hydra_config/verl-0_7_0/sft/trainer/default
  - /hydra_config/verl-0_7_0/profiler/profiler
  - /hydra_config/verl-0_7_0/sft/checkpoint/default
  - _self_

version: 1.0.1

run:
  name: verl-sft-deepseek-r1-distilled-qwen-1-dot-5b-fft

trainer:
  num_nodes: 1

training_config:
  data:
    # Global batch size. Must be >= total GPUs (nodes * 8) to avoid batch_size=0 error.
    train_batch_size: 64
    micro_batch_size_per_gpu: 8
    # The inherited default is `error`, which aborts on any over-length record. Left
    # truncation drops the head of the prompt and keeps the target response, which is
    # what SFT trains on.
    truncation: left

  engine:
    strategy: fsdp2
    model_dtype: bf16
    forward_prefetch: true

  model:
    path: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
    trust_remote_code: false
    use_liger: true
    use_fused_kernels: false

  optim:
    lr: 2.0e-05
    weight_decay: 0.1
    betas: [0.9, 0.95]
    lr_scheduler_type: cosine

  trainer:
    project_name: verl_sft_deepseek_r1_distill_qwen_1_5b
    experiment_name: deepseek_r1_distill_qwen_1_5b_sft_fsdp_fft_tatqa
    total_epochs: 1
    max_ckpt_to_keep: 3
    resume_mode: resume_path
