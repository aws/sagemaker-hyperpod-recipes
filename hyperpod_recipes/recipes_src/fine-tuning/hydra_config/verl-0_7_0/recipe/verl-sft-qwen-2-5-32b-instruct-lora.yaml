# @package recipes
defaults:
  - /hydra_config/verl-0_7_0/sft/default
  - /hydra_config/verl-0_7_0/sft/data/default
  - /hydra_config/verl-0_7_0/model/hf_model
  - /hydra_config/verl-0_7_0/engine/fsdp
  - /hydra_config/verl-0_7_0/optim/fsdp
  - /hydra_config/verl-0_7_0/sft/trainer/default
  - /hydra_config/verl-0_7_0/profiler/profiler
  - /hydra_config/verl-0_7_0/sft/checkpoint/default
  - /hydra_config/verl-0_7_0/sft/peft/lora
  - _self_

version: 1.0.1

run:
  name: verl-sft-qwen-2-5-32b-instruct-lora

trainer:
  num_nodes: 1

training_config:
  data:
    train_batch_size: 16
    micro_batch_size_per_gpu: 2
    truncation: left

  engine:
    strategy: fsdp2
    model_dtype: bf16
    forward_prefetch: true

  model:
    path: Qwen/Qwen2.5-32B-Instruct
    use_liger: true
  optim:
    lr: 2.0e-04
    weight_decay: 0.001
    betas: [0.9, 0.95]
    lr_scheduler_type: cosine

  trainer:
    project_name: verl_sft_qwen_2_5_32b_instruct
    experiment_name: qwen_2_5_32b_instruct_sft_fsdp_lora_tatqa
    max_ckpt_to_keep: 3
    resume_mode: resume_path
