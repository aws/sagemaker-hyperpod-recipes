# @package recipes
defaults:
  - /hydra_config/verl-0_7_0/sft/default
  - /hydra_config/verl-0_7_0/dpo/data/default
  - /hydra_config/verl-0_7_0/model/hf_model
  - /hydra_config/verl-0_7_0/engine/fsdp
  - /hydra_config/verl-0_7_0/optim/fsdp
  - /hydra_config/verl-0_7_0/sft/trainer/default
  - /hydra_config/verl-0_7_0/dpo/trainer/default
  - /hydra_config/verl-0_7_0/profiler/profiler
  - /hydra_config/verl-0_7_0/sft/checkpoint/default
  - _self_

version: 2.0.6

run:
  name: verl-dpo-llama-3-dot-2-1b-instruct-fft

trainer:
  num_nodes: 1

training_config:
  data:
    train_batch_size: 16
    micro_batch_size_per_gpu: 1
    truncation: right
    train_dataset_name: ""  # llmft parity override: training_data_name
    val_dataset_name: ""  # llmft parity override: validation_data_name

  model:
    path: meta-llama/Llama-3.2-1B-Instruct
    generation_cfg:  # llmft parity override: temperature / max_response_length
      temperature: 0.6
      max_new_tokens: 2048

  engine:
    use_torch_compile: true
    model_dtype: bfloat16
    strategy: fsdp2

  optim:
    lr: 1.0e-5
    weight_decay: 0.0
    lr_warmup_steps_ratio: 0.1
    min_lr_ratio: 0.1
    lr_scheduler_type: cosine
    gradient_clipping: true  # llmft parity override: gradient_clipping

  trainer:
    beta: 0.01
    loss_type: sigmoid
    total_epochs: 3
    save_freq: after_each_epoch
    test_freq: 5
    logging_steps: 1  # llmft parity override: logging_steps
