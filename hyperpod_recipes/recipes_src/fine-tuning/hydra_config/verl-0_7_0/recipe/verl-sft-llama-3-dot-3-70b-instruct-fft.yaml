# @package recipes
defaults:
  - /hydra_config/verl-0_7_0/sft/default
  - /hydra_config/verl-0_7_0/sft/data/default
  - /hydra_config/verl-0_7_0/model/hf_model
  - /hydra_config/verl-0_7_0/engine/fsdp
  - /hydra_config/verl-0_7_0/optim/fsdp
  - /hydra_config/verl-0_7_0/sft/trainer/default
  - /hydra_config/verl-0_7_0/profiler/profiler
  - /hydra_config/verl-0_7_0/sft/checkpoint/default
  - _self_

version: 1.0.1

run:
  name: verl-sft-llama-3-dot-3-70b-instruct-fft

trainer:
  # 70B full fine-tuning does not fit one node: bf16 weights alone are ~140GB, and
  # optimizer state plus activations exceed a single node's 640GB. Matches every other
  # 70B+ FFT recipe, including this model's DPO/FFT sibling.
  num_nodes: 4

training_config:
  data:
    train_batch_size: 16
    micro_batch_size_per_gpu: 2
    truncation: left
    ignore_input_ids_mismatch: true
    use_dynamic_bsz: true

  model:
    path: meta-llama/Llama-3.3-70B-Instruct
    trust_remote_code: false
    use_liger: true
    use_fused_kernels: false

  engine:
    strategy: fsdp2
    model_dtype: bf16
    forward_prefetch: true

  optim:
    lr: 1.0e-05
    weight_decay: 0.1
    betas: [0.9, 0.95]
    lr_scheduler_type: cosine

  trainer:
    project_name: verl_sft_llama_3_3_70b
    experiment_name: llama_3_3_70b_sft_fsdp_fft_tatqa
    total_epochs: 1
    max_ckpt_to_keep: 3
    resume_mode: resume_path
