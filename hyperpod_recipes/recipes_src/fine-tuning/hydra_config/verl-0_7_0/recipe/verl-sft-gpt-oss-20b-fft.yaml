# @package recipes
defaults:
  - /hydra_config/verl-0_7_0/sft/default
  - /hydra_config/verl-0_7_0/sft/data/default
  - /hydra_config/verl-0_7_0/model/hf_model
  - /hydra_config/verl-0_7_0/engine/fsdp
  - /hydra_config/verl-0_7_0/optim/fsdp
  - /hydra_config/verl-0_7_0/sft/trainer/default
  - /hydra_config/verl-0_7_0/profiler/profiler
  - /hydra_config/verl-0_7_0/sft/checkpoint/default
  - _self_

version: 1.0.1

run:
  name: verl-sft-gpt-oss-20b-fft

trainer:
  num_nodes: 1

training_config:
  data:
    ignore_input_ids_mismatch: true
    train_batch_size: 16
    micro_batch_size_per_gpu: 1
    truncation: left
    train_max_samples: -1
    val_max_samples: -1

  model:
    path: openai/gpt-oss-20b-bf16
    # These two match the config the 16,384 ceiling was measured with. use_liger fuses
    # cross-entropy and cuts activation memory, so turning it off would make the shipped
    # recipe need more memory than was ever measured.
    use_liger: true
    trust_remote_code: true
    # gpt-oss needs this kernel; the stock attention implementation will not load it.
    override_config:
      attn_implementation: kernels-community/vllm-flash-attn3

  engine:
    strategy: fsdp2
    model_dtype: bf16
    forward_prefetch: true

  optim:
    lr: 1.0e-5
    weight_decay: 0.0
    betas: [0.9, 0.95]
    lr_scheduler_type: cosine
    lr_warmup_steps_ratio: 0.1

  trainer:
    project_name: verl_sft_gpt_oss_20b
    experiment_name: gpt_oss_20b_sft_fsdp_fft
    total_epochs: 3
    max_ckpt_to_keep: 3
    resume_mode: resume_path
