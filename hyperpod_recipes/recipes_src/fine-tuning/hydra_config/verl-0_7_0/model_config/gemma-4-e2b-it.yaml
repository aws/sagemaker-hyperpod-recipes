# @package recipes
# google/gemma-4-E2B-it model configuration for verl-0.7.0
training_config:
  model:
    path: google/gemma-4-E2B-it
    trust_remote_code: false
    use_liger: false
    use_fused_kernels: true
    enable_gradient_checkpointing: false
    tiled_mlp:
      enabled: true
      num_shards: 8
    target_modules: .*q_proj.*|.*k_proj.*|.*v_proj.*|.*o_proj.*|.*gate_proj.*|.*up_proj.*|.*down_proj.*
    exclude_modules: .*vision_tower.*|.*visual.*|.*embed_vision.*|.*embed_audio.*|.*audio_tower.*
    override_config:
      attn_implementation: flash_attention_2
