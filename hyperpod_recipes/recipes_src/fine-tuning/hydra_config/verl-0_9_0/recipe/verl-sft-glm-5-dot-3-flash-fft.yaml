# @package recipes
# GLM-5.3-Flash SFT full fine-tune on the Megatron engine. The recipes in glm-0_9_0/ set the
# sequence length.
defaults:
  - /hydra_config/verl-0_9_0/sft/default
  - /hydra_config/verl-0_9_0/sft/data/default
  - /hydra_config/verl-0_9_0/model/hf_model
  - /hydra_config/verl-0_9_0/engine/megatron
  - /hydra_config/verl-0_9_0/optim/megatron
  - /hydra_config/verl-0_9_0/sft/trainer/default
  - /hydra_config/verl-0_9_0/profiler/profiler
  - /hydra_config/verl-0_9_0/sft/checkpoint/default
  - /hydra_config/verl-0_9_0/model_config/glm-5-dot-3-flash
  - _self_

version: 1.0.0

run:
  name: verl-sft-glm-5-dot-3-flash-fft

trainer:
  num_nodes: 8

training_config:
  checkpoint:
    # 'optimizer' is left out of both lists: megatron-core cannot save the CPU-offloaded optimizer
    # state, so a resumed run restarts Adam's moments from zero. 'hf_model' is the same HF export as
    # 'model' here and is saved once.
    save_contents:
      - model
      - extra
      - hf_model
    load_contents:
      - model
      - extra
      - hf_model

  data:
    train_batch_size: 32
    micro_batch_size_per_gpu: 1
    use_dynamic_bsz: true
    # With pad_mode no_padding an over-length row keeps its first max_length tokens, so it loses its
    # end, including the assistant_eos_token. Rows are truncated one by one, before packing.
    truncation: right

  model:
    lora_alpha: 0
    target_modules: null

  engine:
    # TP16 x PP1 x CP1 over 8 nodes x 8 GPUs => DP4. EP32 x ETP1 shards the 288 experts.
    # 8 nodes is the minimum on 80 GB GPUs: host RAM must hold the CPU-offloaded optimizer state
    # (about 2.48 TB in total).
    tensor_model_parallel_size: 16
    expert_model_parallel_size: 32

  optim:
    lr: 1.0e-5
    min_lr: 1.0e-6
    lr_warmup_steps: -1
    lr_warmup_steps_ratio: 0.1
    lr_decay_style: cosine
    # verl does not pass optim.betas to Megatron, so Adam runs with Megatron's defaults
    # (adam_beta1 0.9, adam_beta2 0.999), as in the validated runs. To change them, set adam_beta1
    # and adam_beta2 under override_optimizer_config.
    betas: [0.9, 0.999]
    weight_decay: 0.0
    # fp32 main grads and Adam moments; bf16 main grads break the fused grad norm on the fp32 params
    # (MoE router, KDA decay).
    use_precision_aware_optimizer: true
    override_optimizer_config:
      # The optimizer state does not fit in GPU memory at this parallelism.
      optimizer_cpu_offload: true
      optimizer_offload_fraction: 1.0
      overlap_cpu_optimizer_d2h_h2d: true

  trainer:
    project_name: verl_sft_glm_5_3_flash
    experiment_name: glm_5_3_flash_sft_megatron_fft
    total_epochs: 3
    nnodes: 8
    test_freq: after_each_epoch
    max_ckpt_to_keep: 3
    seed: 42
    # A job starts from the base model. Starting a new job from this recipe's output is not supported
    # yet: the Megatron engine does not write checkpoints/hf or checkpoints/hf_merged. The trained
    # model is the full HF export at global_step_<N>/model/huggingface.
    resume_mode: disable
    merge_lora_on_final_save: false
