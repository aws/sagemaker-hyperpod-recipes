# @package recipes
# GLM-5.3-Flash SFT LoRA on the Megatron engine. The recipes in glm-0_9_0/ set the sequence length.
defaults:
  - /hydra_config/verl-0_9_0/sft/default
  - /hydra_config/verl-0_9_0/sft/data/default
  - /hydra_config/verl-0_9_0/model/hf_model
  - /hydra_config/verl-0_9_0/engine/megatron
  - /hydra_config/verl-0_9_0/optim/megatron
  - /hydra_config/verl-0_9_0/sft/trainer/default
  - /hydra_config/verl-0_9_0/profiler/profiler
  - /hydra_config/verl-0_9_0/sft/checkpoint/default
  - /hydra_config/verl-0_9_0/model_config/glm-5-dot-3-flash
  - _self_

version: 1.0.0

run:
  name: verl-sft-glm-5-dot-3-flash-lora

trainer:
  num_nodes: 2

training_config:
  data:
    train_batch_size: 32
    micro_batch_size_per_gpu: 1
    use_dynamic_bsz: true
    # With pad_mode no_padding an over-length row keeps its first max_length tokens, so it loses its
    # end, including the assistant_eos_token. Rows are truncated one by one, before packing.
    truncation: right

  model:
    lora_rank: 128
    lora_alpha: 32
    target_modules:
      - linear_q_down_proj
      - linear_q_up_proj
      - linear_kv_down_proj
      - linear_proj
      - linear_fc1
      - linear_fc2
    lora:
      rank: 128
      alpha: 32
      # Megatron-Bridge matches a target by module name. The four attention targets below exist only
      # in the 11 sparse-attention (DSA, absorbed-MLA) layers; the 34 linear-attention (KDA) layers
      # name their projections q_proj, k_proj, v_proj, f_a_proj, f_b_proj, g_a_proj, g_b_proj,
      # b_proj and o_proj, and this set does not adapt them. linear_kv_up_proj is left out because
      # absorbed MLA reads its weight directly and never runs the module, so an adapter on it would
      # not apply.
      # linear_fc1 and linear_fc2 adapt the MLP of all 45 layers.
      target_modules:
        - linear_q_down_proj
        - linear_q_up_proj
        - linear_kv_down_proj
        - linear_proj
        - linear_fc1
        - linear_fc2

  engine:
    # TP8 x PP1 x CP1 over 2 nodes x 8 GPUs => DP2. EP16 x ETP1 shards the 288 experts.
    # The routed experts' LoRA uses Megatron-Bridge's default share_expert_adapters (true): each MoE
    # layer has one linear_fc1 and one linear_fc2 adapter, shared by all 288 experts and replicated
    # on every EP rank (same start, gradient summed across EP), so the EP size does not change how
    # many adapters are trained or which experts share them. The HF export writes that adapter once
    # per expert.
    # The gradient-norm clip counts that replicated adapter once per EP rank, so at EP16 its share of
    # the clipped norm is sqrt(16) = 4x its true value (about 92% of the squared grad_norm in the QSQ
    # validation run: this recipe at 4,096 tokens, 400 steps, unpacked, with the earlier fixed 5-step
    # warmup). clip_grad 1.0 was active there (all 5 warmup steps and 40 of the 395 later steps: every
    # step from 6 to 25, the last at step 138); the current warmup schedule may clip differently, and a
    # different expert_model_parallel_size changes the effective clip and trains differently (by
    # estimate, EP8 acts like clip_grad 1.36 at EP16). Keep EP16 and clip_grad 1.0 as validated.
    tensor_model_parallel_size: 8
    expert_model_parallel_size: 16
    override_transformer_config:
      # Off for LoRA: at TP > 1 the overlap adds the shared-expert linear_fc2 LoRA delta TP times
      # (NVIDIA-NeMo/Megatron-Bridge issue #5634).
      moe_shared_expert_overlap: false
      moe_router_dtype: fp32

  optim:
    lr: 1.0e-4
    min_lr: 1.0e-5
    lr_warmup_steps: -1
    lr_warmup_steps_ratio: 0.1
    lr_decay_style: cosine
    # verl does not pass optim.betas to Megatron, so Adam runs with Megatron's defaults
    # (adam_beta1 0.9, adam_beta2 0.999), as in the validated runs. To change them, set adam_beta1
    # and adam_beta2 under override_optimizer_config.
    betas: [0.9, 0.999]
    weight_decay: 0.0

  trainer:
    project_name: verl_sft_glm_5_3_flash
    experiment_name: glm_5_3_flash_sft_megatron_lora
    total_epochs: 3
    nnodes: 2
    test_freq: after_each_epoch
    max_ckpt_to_keep: 3
    seed: 42
    # A job starts from the base model. Starting a new job from this recipe's output is not supported
    # yet: the Megatron engine does not write checkpoints/hf or checkpoints/hf_merged.
    resume_mode: disable
    # The Megatron engine ignores this for now: every save writes only the PEFT adapter, to
    # global_step_<N>/model/huggingface/adapter, and no merged model. vLLM 0.30 cannot serve a
    # GLM-5.3-Flash LoRA adapter, so merge it into the base model before serving: dequantize the FP8
    # base to bf16, add (alpha / rank) * B @ A to each adapted weight, and drop the FP8 scales and
    # quantization_config (about 643 GB in bf16).
    merge_lora_on_final_save: true
