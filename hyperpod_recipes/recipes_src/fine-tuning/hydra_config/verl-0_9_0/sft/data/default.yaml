# @package recipes.training_config.data
train_files: null

val_files: null

messages_key: messages

train_batch_size: 256

micro_batch_size_per_gpu: 4

max_length: 1024

pad_mode: no_padding

truncation: error

use_dynamic_bsz: true

max_token_len_per_gpu: 8192

ignore_input_ids_mismatch: false

train_val_split_ratio: 1.0

custom_cls:
  path: null
  name: null

# verl 0.9 sft_trainer_engine data keys. SMTJ passes training_config as the complete verl config
# (no merge with verl's defaults), so every key the trainer reads must be present.
train_max_samples: -1

val_max_samples: -1

tools_key: tools

enable_thinking_key: enable_thinking

enable_thinking_default: null

balance_dp_token: false

use_shm: false

apply_chat_template_kwargs: {}

num_workers: 8
