# @package recipes
# Gemma 4 31B IT model configuration for verl-0.9.0
training_config:
  model:
    path: google/gemma-4-31B-it
    trust_remote_code: true
    use_liger: false
    use_fused_kernels: true
    target_modules: .*q_proj.*|.*k_proj.*|.*v_proj.*|.*o_proj.*|.*gate_proj.*|.*up_proj.*|.*down_proj.*
    exclude_modules: .*vision_tower.*|.*embed_vision.*|.*embed_audio.*|.*audio_tower.*|.*router.*|.*experts.*
    # Text-only training: Gemma 4's vision-bidirectional mask requires mm_token_type_ids in training,
    # which verl 0.9 strips from inputs (multiturn_sft_dataset). No vision tokens -> plain causal mask.
    # FA2 with packing, as in 0.7: ForgeVerlAlchemist patch 0055 runs the sliding layers on flash_attention_2
    # and the head_dim-512 global layers (above FA2's 256 limit) on packed-aware SDPA. Needs an image with 0055.
    use_remove_padding: true
    override_config:
      attn_implementation: flash_attention_2
      text_config:
        use_bidirectional_attention: null
    tiled_mlp:
      enabled: false
      num_shards: 4
