defaults:
  - /hydra_config/verl-0_7_0/default
  - _self_

display_name: Qwen 3.6 27B GRPO RLVR Fine-Tuning with LoRA
version: 2.0.5
instance_types:
  - ml.p5.48xlarge
run:
  model_type: verl
  name: verl-grpo-qwen-3-dot-6-27b-lora
  results_dir: ${base_results_dir}/${.name}
trainer:
  num_nodes: 1

ray_cluster:
  head_node:
    cpu: '16'
    cpuLimit: null
    gpu: '0'
    memory: 32Gi
    memoryLimit: null
  worker_nodes:
    cpu: '48'
    cpuLimit: null
    gpu: '8'
    memory: 144Gi
    memoryLimit: null
    replicas: 1

training_config:
  # Algorithm: switch from GAE (upstream default) to GRPO
  algorithm:
    adv_estimator: grpo
    rollout_correction:
      rollout_is: sequence
      rollout_is_threshold: 3

  actor_rollout_ref:
    actor:
      kl_loss_coef: 0
      clip_ratio_high: 0.28
      optim:
        lr: 1.0e-05
      fsdp_config:
        fsdp_size: 8
        strategy: fsdp2
        wrap_policy:
          transformer_layer_cls_to_wrap:
            - Qwen3_5DecoderLayer
            - Qwen3_5VisionBlock

    # Reference model overrides
    ref:
      log_prob_use_dynamic_bsz: true
      entropy_from_logits_with_chunking: true
      log_prob_max_token_len_per_gpu: 16384
      fsdp_config:
        strategy: fsdp2
        wrap_policy:
          transformer_layer_cls_to_wrap:
            - Qwen3_5DecoderLayer
            - Qwen3_5VisionBlock

    # Rollout overrides (vLLM engine)
    rollout:
      name: vllm
      prompt_length: 8192
      response_length: 8192
      tensor_model_parallel_size: 4
      log_prob_max_token_len_per_gpu: 16384
      log_prob_use_dynamic_bsz: true
      layered_summon: true
      merge_lora_for_inference: true
      calculate_log_probs: true
      max_model_len: 32768
      prometheus:
        served_model_name: Qwen/Qwen3.6-27B
      engine_kwargs:
        vllm:
          gdn_prefill_backend: triton


    # Model config (Qwen 3.6 27B + LoRA)
    model:
      patch_full_model: false
      patched_model_path: null
      path: Qwen/Qwen3.6-27B
      lora_rank: 32
      lora_alpha: 64
      is_saving_checkpoint_in_lora: true
      exclude_modules: .*visual.*



  # Critic overrides
  critic:
    ppo_max_token_len_per_gpu: 16384

  # Trainer overrides
  trainer:
    project_name: verl-grpo-rlvr
    experiment_name: qwen-3-dot-6-27b-lora
    logger:
      - console
      - mlflow
    resume_mode: resume_path
    test_freq: 10
    total_epochs: 1
    save_freq: 20
    default_local_dir: /opt/ml/model
    merge_lora_on_final_save: true
  data:
    max_prompt_length: 8192
    max_response_length: 8192
    train_val_split_ratio: 0.9  # add this alongside existing data fields
    apply_chat_template_kwargs:
      enable_thinking: true
    auto_convert_format: false
    shuffle: false
    return_raw_chat: true

  # Reward model overrides
  reward_model:
    strategy: fsdp2
    rollout:
      name: vllm
    model:
      input_tokenizer: Qwen/Qwen3.6-27B

  # Reward manager (RLVR)
  reward_manager:
    name: prime
  custom_reward_function:
    lambda_arn: ''
    path: ''
    name: ''

  mlflow:
    run_id: ''
    tracking_uri: ''
