defaults:
  - /hydra_config/verl-0_7_0/default
  - _self_

display_name: Qwen 3.6 35B A3B GRPO RLVR Fine-Tuning
version: 1.0.0
instance_types:
  - ml.p5.48xlarge
run:
  model_type: verl
  name: verl-grpo-qwen-3-dot-6-35b-a3b-fft
  results_dir: ${base_results_dir}/${.name}
trainer:
  num_nodes: 1

ray_cluster:
  head_node:
    cpu: '16'
    cpuLimit: null
    gpu: '0'
    memory: 32Gi
    memoryLimit: null
  worker_nodes:
    cpu: '48'
    cpuLimit: null
    gpu: '8'
    memory: 144Gi
    memoryLimit: null
    replicas: 1

training_config:
  # Algorithm: switch from GAE (upstream default) to GRPO
  algorithm:
    adv_estimator: grpo

  actor_rollout_ref:
    # Actor overrides
    actor:
      use_kl_loss: true
      kl_loss_coef: 0.001
      use_dynamic_bsz: true
      ppo_mini_batch_size: 32
      ppo_max_token_len_per_gpu: 16384
      optim:
        lr: 1.0e-05

    # Reference model overrides
    ref:
      entropy_from_logits_with_chunking: true
      log_prob_max_token_len_per_gpu: 16384
      fsdp_config:
        param_offload: true

    # Rollout overrides (vLLM engine)
    rollout:
      name: vllm
      prompt_length: 2048
      response_length: 2048
      tensor_model_parallel_size: 8
      gpu_memory_utilization: 0.5
      log_prob_max_token_len_per_gpu: 16384
      layered_summon: true
      merge_lora_for_inference: false
      engine_kwargs:
        vllm:
          gdn_prefill_backend: triton

    # Model config (Qwen 3.6 35B A3B)
    model:
      path: Qwen/Qwen3.6-35B-A3B
      override_config:
        experts_implementation: grouped_mm
      lora_rank: 0
      is_saving_checkpoint_in_lora: false

  # Trainer overrides
  trainer:
    project_name: verl-grpo-rlvr
    experiment_name: qwen-3-dot-6-35b-a3b-fft
    logger:
      - console
      - mlflow
    resume_mode: resume_path
    test_freq: 10
    total_epochs: 1
    save_freq: 20
    default_local_dir: /opt/ml/model
    merge_lora_on_final_save: true

  # Data overrides
  data:
    max_prompt_length: 2048
    max_response_length: 2048
    train_batch_size: 256
    train_val_split_ratio: 0.9
    return_raw_chat: true

  # Reward model overrides
  reward_model:
    strategy: fsdp2
    rollout:
      name: vllm
    model:
      input_tokenizer: Qwen/Qwen3.6-35B-A3B

  # Reward manager (RLVR)
  reward_manager:
    name: prime
  custom_reward_function:
    lambda_arn: ''
    path: ''
    name: ''

  mlflow:
    run_id: ''
    tracking_uri: ''
