defaults:
  - /hydra_config/verl-0_7_0/sft/default
  - /hydra_config/verl-0_7_0/sft/data/default
  - /hydra_config/verl-0_7_0/model/hf_model
  - /hydra_config/verl-0_7_0/engine/fsdp
  - /hydra_config/verl-0_7_0/optim/fsdp
  - /hydra_config/verl-0_7_0/sft/trainer/default
  - /hydra_config/verl-0_7_0/profiler/profiler
  - /hydra_config/verl-0_7_0/sft/checkpoint/default
  - /hydra_config/verl-0_7_0/sft/peft/lora
  - /hydra_config/verl-0_7_0/model_config/qwen-3-dot-5-35b-a3b
  - _self_

display_name: "Qwen 3.5 35B A3B SFT LoRA Fine-Tuning"
version: 1.0.0
instance_types: ["ml.p5.48xlarge"]

run:
  name: verl-sft-qwen-3-dot-5-35b-a3b-lora

trainer:
  num_nodes: 1

training_config:
  data:
    train_batch_size: 256
    micro_batch_size_per_gpu: 2
    max_length: 16384
    max_token_len_per_gpu: 32768
    truncation: left
    train_max_samples: -1
    val_max_samples: -1

  model:
    override_config:
      attn_implementation: flash_attention_2
    target_parameters:
      - experts.gate_up_proj
      - experts.down_proj

  engine:
    strategy: fsdp2
    forward_prefetch: true
    use_torch_compile: false

  optim:
    lr: 5.0e-05
    lr_warmup_steps: 20
    lr_warmup_steps_ratio: 0.1
    betas: [0.9, 0.95]
    lr_scheduler_type: cosine

  trainer:
    project_name: verl_sft_qwen3_5_35b_a3b
    experiment_name: qwen3_5_35b_a3b_sft_fsdp_lora
    total_epochs: 2
    save_freq: 20
    test_freq: 10
    max_ckpt_to_keep: 3
    resume_mode: resume_path
