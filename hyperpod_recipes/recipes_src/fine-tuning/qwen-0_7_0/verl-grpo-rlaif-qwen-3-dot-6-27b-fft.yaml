defaults:
  - /hydra_config/verl-0_7_0/default
  - _self_

display_name: Qwen 3.6 27B GRPO RLAIF Fine-Tuning
version: 2.0.6
instance_types:
  - ml.p5.48xlarge
  - ml.p4de.24xlarge
run:
  model_type: verl
  name: verl-grpo-qwen-3-dot-6-27b-fft
  results_dir: ${base_results_dir}/${.name}
trainer:
  num_nodes: 1

ray_cluster:
  head_node:
    cpu: '16'
    cpuLimit: null
    gpu: '0'
    memory: 32Gi
    memoryLimit: null
  worker_nodes:
    cpu: '48'
    cpuLimit: null
    gpu: '8'
    memory: 144Gi
    memoryLimit: null
    replicas: 1

training_config:
  # Algorithm: switch from GAE (upstream default) to GRPO
  algorithm:
    adv_estimator: grpo
  actor_rollout_ref:
    actor:
      use_kl_loss: true
      ppo_max_token_len_per_gpu: 12288
      optim:
        lr: 1.0e-05
      fsdp_config:
        fsdp_size: 8
        strategy: fsdp2
        wrap_policy:
          transformer_layer_cls_to_wrap:
            - Qwen3_5DecoderLayer
            - Qwen3_5VisionBlock

    # Reference model overrides
    ref:
      log_prob_use_dynamic_bsz: true
      entropy_from_logits_with_chunking: true
      log_prob_max_token_len_per_gpu: 12288
      fsdp_config:
        strategy: fsdp2
        wrap_policy:
          transformer_layer_cls_to_wrap:
            - Qwen3_5DecoderLayer
            - Qwen3_5VisionBlock

    # Rollout overrides (vLLM engine)
    rollout:
      name: vllm
      prompt_length: 2048
      response_length: 4096
      tensor_model_parallel_size: 4
      log_prob_max_token_len_per_gpu: 12288
      layered_summon: true
      merge_lora_for_inference: true
      prometheus:
        served_model_name: Qwen/Qwen3.6-27B
      engine_kwargs:
        vllm:
          gdn_prefill_backend: triton


    # Model config (Qwen 3.6 27B)
    model:
      patch_full_model: false
      patched_model_path: null
      path: Qwen/Qwen3.6-27B
      lora_alpha: 64
      is_saving_checkpoint_in_lora: false
      exclude_modules: .*visual.*



  # Critic overrides
  critic:
    ppo_max_token_len_per_gpu: 16384

  # Trainer overrides
  trainer:
    project_name: verl-grpo-rlaif
    experiment_name: qwen-3-dot-6-27b
    logger:
      - console
      - mlflow
    resume_mode: resume_path
    test_freq: 10
    total_epochs: 1
    save_freq: 20
    default_local_dir: /opt/ml/model
    merge_lora_on_final_save: true
  data:
    max_prompt_length: 2048
    max_response_length: 4096
    train_val_split_ratio: 0.9  # add this alongside existing data fields
    apply_chat_template_kwargs:
      enable_thinking: true
    auto_convert_format: false
    shuffle: false
    return_raw_chat: true

  # Reward model overrides
  reward_model:
    strategy: fsdp2
    reward_manager: batch
    rollout:
      name: vllm
    model:
      input_tokenizer: Qwen/Qwen3.6-27B
    reward_kwargs:
      kwargs:
        aws_region_name: null
        llmj_prompt_template_path: /opt/ml/code/verl/summarize.jinja
        max_workers: 100
        model_id: bedrock/openai.gpt-oss-120b-1:0
        num_retries: 5
        range:
          - 0.0
          - 1.0
        sampling_params:
          max_completion_tokens: 2048
          reasoning_effort: null
          temperature: 0.0
          top_p: 0.9
      reward_fn_name: llmj

  # Reward manager (RLAIF)
  reward_manager:
    name: batch
  custom_reward_function:
    lambda_arn: ''
    path: ''
    name: ''

  mlflow:
    run_id: ''
    tracking_uri: ''
