defaults:
  - /hydra_config/verl-0_7_0/default
  - _self_

display_name: Gemma 4 31B IT GRPO RLVR Full Fine-Tuning (Text)
version: 2.0.4
instance_types:
  - ml.p5.48xlarge
run:
  model_type: verl
  name: verl-grpo-rlvr-gemma-4-31b-it-fft
  results_dir: ${base_results_dir}/${.name}
trainer:
  num_nodes: 2

ray_cluster:
  head_node:
    cpu: '16'
    cpuLimit: null
    gpu: '0'
    memory: 32Gi
    memoryLimit: null
  worker_nodes:
    cpu: '48'
    cpuLimit: null
    gpu: '8'
    memory: 144Gi
    memoryLimit: null
    replicas: 2

training_config:
  algorithm:
    adv_estimator: grpo
    norm_adv_by_std_in_grpo: false

  actor_rollout_ref:
    actor:
      use_kl_loss: true
      clip_ratio_high: 0.28
      ppo_mini_batch_size: 64
      ppo_micro_batch_size_per_gpu: 2
      ppo_max_token_len_per_gpu: 20480
      freeze_vision_tower: true
      fsdp_config:
        optimizer_offload: true
        strategy: fsdp2
        wrap_policy:
          transformer_layer_cls_to_wrap:
            - Gemma4TextDecoderLayer
      optim:
        lr: 5.0e-06
        warmup_style: constant

    ref:
      log_prob_micro_batch_size_per_gpu: 1
      log_prob_use_dynamic_bsz: true
      log_prob_max_token_len_per_gpu: 20480
      fsdp_config:
        param_offload: true
        strategy: fsdp2

    rollout:
      name: vllm
      prompt_length: 16384
      response_length: 4096
      tensor_model_parallel_size: 8
      gpu_memory_utilization: 0.5
      max_model_len: 20480
      max_num_batched_tokens: 20480
      log_prob_micro_batch_size_per_gpu: 1
      log_prob_use_dynamic_bsz: true
      log_prob_max_token_len_per_gpu: 20480
      disable_log_stats: false
      merge_lora_for_inference: false

    model:
      path: google/gemma-4-31B-it
      override_config:
        attn_implementation: flash_attention_2
      use_fused_kernels: true
  trainer:
    project_name: gemma4-rl
    experiment_name: gemma-4-31b-it-grpo-rlvr-fft
    logger:
      - console
      - mlflow
    nnodes: 2
    test_freq: 5
    total_epochs: 1
    save_freq: 5
    default_local_dir: /opt/ml/model
    merge_lora_on_final_save: true

  data:
    max_prompt_length: 16384
    max_response_length: 4096
    train_batch_size: 256
    truncation: left
    trust_remote_code: true
    apply_chat_template_kwargs:
      enable_thinking: false
    train_val_split_ratio: 0.9

  reward_model:
    rollout:
      name: vllm

  reward_manager:
    name: prime
  custom_reward_function:
    lambda_arn: ''
    path: ''
    name: ''

  mlflow:
    run_id: ''
    tracking_uri: ''
