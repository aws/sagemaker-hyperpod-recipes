defaults:
- /hydra_config/verl-0_7_0/sft/default
- /hydra_config/verl-0_7_0/sft/data/default
- /hydra_config/verl-0_7_0/model/hf_model
- /hydra_config/verl-0_7_0/engine/fsdp
- /hydra_config/verl-0_7_0/optim/fsdp
- /hydra_config/verl-0_7_0/sft/trainer/default
- /hydra_config/verl-0_7_0/profiler/profiler
- /hydra_config/verl-0_7_0/sft/checkpoint/default
- /hydra_config/verl-0_7_0/sft/peft/lora
- /hydra_config/verl-0_7_0/model_config/gemma-4-e2b-it
- _self_
display_name: gemma-4-E2B-it SFT LoRA Fine-Tuning
version: 2.0.3
instance_types:
- ml.p5.48xlarge
- ml.p4de.24xlarge
- ml.p4d.24xlarge
run:
  name: verl-sft-gemma-4-e2b-it-lora
trainer:
  num_nodes: 1
training_config:
  data:
    train_batch_size: 128
    micro_batch_size_per_gpu: 4
    max_length: 32768
    max_token_len_per_gpu: 32768
    truncation: left
    apply_chat_template_kwargs:
      enable_thinking: false
    ignore_input_ids_mismatch: true
  engine:
    strategy: fsdp2
    model_dtype: bfloat16
    use_fused_kernels: true
    use_dynamic_bsz: true
    max_token_len_per_gpu: 32768
  optim:
    lr: 0.0002
    weight_decay: 0.001
    betas:
    - 0.9
    - 0.95
    lr_scheduler_type: cosine
  trainer:
    project_name: verl_sft
    experiment_name: sft_fsdp
    total_epochs: 1
    resume_mode: resume_path
    test_freq: 5
  trainer_callbacks:
  - _target_: metering_callback.MeteringCallback
    output_path: /opt/ml/metering
  model:
    lora_rank: 32
    lora_alpha: 64
    enable_gradient_checkpointing: true
