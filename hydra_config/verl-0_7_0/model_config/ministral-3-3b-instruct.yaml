# @package recipes
# mistralai/Ministral-3-3B-Instruct-2512-BF16 model configuration for verl-0.7.0
training_config:
  model:
    path: mistralai/Ministral-3-3B-Instruct-2512-BF16
    trust_remote_code: false
    use_liger: false
    use_fused_kernels: false
    target_modules: .*q_proj.*|.*k_proj.*|.*v_proj.*|.*o_proj.*|.*gate_proj.*|.*up_proj.*|.*down_proj.*
    exclude_modules: .*vision_tower.*|.*visual.*|.*embed_vision.*|.*embed_audio.*|.*audio_tower.*
    override_config:
      attn_implementation: flash_attention_2
