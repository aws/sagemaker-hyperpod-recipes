name: Python Unit Test CI

on:
  pull_request:
    branches:
      - main # Change to the branch we want to target for PRs
  push:
    branches:
      - main # Triggers on direct pushes to the main branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive # Checkout submodules as well
          fetch-depth: 0 # Full history for diff-cover branch comparison

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install unit test dependencies
        run: uv sync --python 3.10

      - name: Run unit tests
        # Not bare `pytest`: a transitive sagemaker dep ships a top-level `tests`
        # package that shadows this repo's tests/ unless the root is on sys.path.
        run: uv run --python 3.10 python -m pytest -vv

      - name: Check coverage on new lines
        if: github.event_name == 'pull_request'
        run: |
          uv run --python 3.10 --with diff-cover diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=90
